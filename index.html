<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>مستلزمات الأسنان</title>
<meta name="description" content="تطبيق طلب مستلزمات الأسنان – قارن الأسعار بين الموردين وأضف للسلة بسهولة">
<meta name="theme-color" content="#2563EB">
<link rel="icon" href="assets/icon-192.png" type="image/png">
<link href="https://fonts.googleapis.com/css2?family=Cairo:wght@400;500;600;700;800&display=swap" rel="stylesheet">
<link rel="manifest" href="manifest.json">
<style>
/* ─── Design Tokens ─── */
:root {
  /* Primary */
  --pri:        #2563EB;
  --pri-dark:   #1D4ED8;
  --pri-light:  #3B82F6;
  --pri-soft:   #EFF6FF;
  --pri-border: #BFDBFE;
  --pri-ink:    #ffffff;

  /* Neutrals */
  --ink:        #111827;
  --ink-sub:    #374151;
  --mute:       #6B7280;
  --mute-light: #9CA3AF;
  --line:       #E5E7EB;
  --bg:         #F3F4F6;
  --bg-white:   #ffffff;

  /* Status */
  --good:       #10B981;
  --good-bg:    #ECFDF5;
  --warn:       #F59E0B;
  --warn-bg:    #FFFBEB;
  --bad:        #EF4444;
  --bad-bg:     #FEF2F2;

  /* Misc */
  --radius-sm:  8px;
  --radius-md:  12px;
  --radius-lg:  16px;
  --shadow-sm:  0 1px 3px rgba(0,0,0,.06), 0 1px 2px rgba(0,0,0,.04);
  --shadow-md:  0 2px 10px rgba(15,23,42,.05), 0 1px 3px rgba(15,23,42,.03);
  --shadow-lg:  0 4px 16px rgba(15,23,42,.08);

  color-scheme: light;
  box-sizing: border-box;
}
*, *::before, *::after { box-sizing: border-box; }
/* author display rules (.prod-card is flex) would otherwise beat the UA
   [hidden] rule, so make hiding explicit */
[hidden] { display: none !important; }
html, body { height: 100%; margin: 0; }

body {
  background: var(--bg);
  color: var(--ink);
  font-family: 'Cairo', 'Segoe UI', Tahoma, sans-serif;
  font-size: 15px;
  line-height: 1.5;
  -webkit-font-smoothing: antialiased;
}
button, input { font: inherit; color: inherit; }
button { cursor: pointer; border: none; background: none; padding: 0; }

/* ─── App Shell ─── */
.app {
  max-width: 430px;
  min-height: 100vh;
  margin: 0 auto;
  display: flex;
  flex-direction: column;
  background: var(--bg-white);
  position: relative;
}
@media (min-width: 500px) {
  .app {
    border-inline: 1px solid var(--line);
    box-shadow: 0 0 40px rgba(37,99,235,.08);
    min-height: 100vh;
  }
}

/* ─── Header ─── */
.hdr {
  display: flex;
  align-items: center;
  gap: 8px;
  padding: 0 16px;
  height: 54px;
  background: var(--bg-white);
  border-bottom: 1px solid var(--line);
  position: sticky;
  top: 0;
  z-index: 10;
}
.hdr-title {
  flex: 1;
  font-size: 18px;
  font-weight: 700;
  color: var(--ink);
  text-align: center;
}
.hdr-logo {
  width: 32px;
  height: 32px;
  border-radius: 10px;
  background: var(--pri-soft);
  display: grid;
  place-items: center;
  font-size: 16px;
  flex: none;
  color: var(--pri);
}
.hdr-btn {
  width: 36px;
  height: 36px;
  border-radius: var(--radius-sm);
  background: var(--bg);
  display: grid;
  place-items: center;
  flex: none;
  position: relative;
  transition: background .15s;
}
.hdr-btn:hover { background: var(--line); }
.hdr-btn svg { display: block; }
.cart-badge {
  position: absolute;
  top: -4px;
  inset-inline-start: -4px;
  background: var(--bad);
  color: #fff;
  border-radius: 10px;
  min-width: 18px;
  height: 18px;
  font-size: 11px;
  font-weight: 700;
  display: grid;
  place-items: center;
  border: 2px solid var(--bg-white);
  padding: 0 3px;
}
.hdr-spacer { width: 36px; flex: none; }

/* ─── Main scroll area ─── */
main {
  flex: 1;
  overflow-y: auto;
  padding: 16px;
  padding-bottom: calc(72px + env(safe-area-inset-bottom, 0px));
}

/* ─── Bottom Navigation ─── */
.nav {
  position: sticky;
  bottom: 0;
  background: var(--bg-white);
  border-top: 1px solid var(--line);
  display: flex;
  padding-bottom: env(safe-area-inset-bottom, 0px);
  z-index: 10;
}
.nav-item {
  flex: 1;
  display: flex;
  flex-direction: column;
  align-items: center;
  gap: 4px;
  padding: 10px 0;
  font-size: 11px;
  font-weight: 600;
  color: var(--mute);
  position: relative;
  transition: color .15s;
}
.nav-item.active { color: var(--pri); }
.nav-item svg { display: block; }
.nav-badge {
  position: absolute;
  top: 6px;
  inset-inline-start: calc(50% + 6px);
  background: var(--bad);
  color: #fff;
  border-radius: 10px;
  min-width: 16px;
  height: 16px;
  font-size: 10px;
  font-weight: 700;
  display: grid;
  place-items: center;
  border: 2px solid var(--bg-white);
  padding: 0 2px;
}

/* ─── Search ─── */
.search-wrap {
  position: relative;
  margin-bottom: 14px;
}
.search-icon {
  position: absolute;
  inset-inline-end: 12px;
  top: 50%;
  transform: translateY(-50%);
  color: var(--mute);
  pointer-events: none;
  display: flex;
}
.search {
  width: 100%;
  padding: 11px 40px 11px 14px;
  border-radius: var(--radius-md);
  border: 1.5px solid var(--line);
  background: var(--bg);
  font-size: 14px;
  color: var(--ink);
  transition: border-color .15s, box-shadow .15s;
}
.search::placeholder { color: var(--mute-light); }
.search:focus {
  outline: none;
  border-color: var(--pri);
  background: var(--bg-white);
  box-shadow: 0 0 0 3px var(--pri-soft);
}

/* ─── Category chips ─── */
.chips {
  display: flex;
  gap: 8px;
  overflow-x: auto;
  padding-bottom: 14px;
  scrollbar-width: none;
}
.chips::-webkit-scrollbar { display: none; }
.chip {
  white-space: nowrap;
  padding: 7px 14px;
  border-radius: 999px;
  border: 1.5px solid var(--line);
  background: var(--bg-white);
  color: var(--ink-sub);
  font-size: 13px;
  font-weight: 600;
  flex: none;
  transition: all .15s;
}
.chip.on {
  background: var(--pri);
  color: #fff;
  border-color: var(--pri);
  box-shadow: 0 2px 8px rgba(37,99,235,.3);
}
.chip:hover:not(.on) {
  border-color: var(--pri-border);
  background: var(--pri-soft);
}

/* ─── Product Card (Home list) ───
   Matches the card spec in "Dental Supplies design html/home.html" */
.prod-card {
  position: relative;
  display: flex;
  flex-direction: column;
  align-items: stretch;
  justify-content: flex-start;
  gap: 0;
  width: 100%;
  min-width: 0;
  padding: 0;
  margin: 0;
  overflow: hidden;
  text-align: right;
  background: var(--bg-white);
  border: 0;
  outline: 1px solid #E5E7EB;
  outline-offset: -1px;
  border-radius: 12px;
  box-shadow: 0 4px 12px rgba(0, 0, 0, .02);
  transition: box-shadow .15s ease;
  cursor: pointer;
}
.prod-card:hover { box-shadow: 0 6px 16px rgba(37, 99, 235, .10); }
.prod-card:active { opacity: .9; }
/* keep the 1px card edge visible while still showing a focus ring */
.prod-card:focus-visible {
  outline-color: var(--pri);
  box-shadow: 0 0 0 3px rgba(37, 99, 235, .25);
}

/* Product image strip */
.prod-icon {
  align-self: stretch;
  width: 100%;
  height: 110px;
  flex: none;
  border-radius: 0;
  background: #EFF6FF;
  display: block;
  overflow: hidden;
}

/* Everything under the image: 12px padding, 8px rhythm */
.prod-body {
  position: relative;
  align-self: stretch;
  display: flex;
  flex-direction: column;
  align-items: flex-start;
  justify-content: flex-start;
  gap: 8px;
  padding: 12px;
  min-width: 0;
}

.prod-name {
  align-self: stretch;
  text-align: right;
  color: #1F2937;
  font-size: 15px;
  font-weight: 700;
  line-height: 1.45;
  white-space: normal;
  overflow: hidden;
  display: -webkit-box;
  -webkit-line-clamp: 2;
  -webkit-box-orient: vertical;
  min-height: 43px;
}
.prod-brand { display: none; }

/* "150 ل.س  يبدأ من" — price first, label to its right */
.prod-price-col {
  align-self: stretch;
  display: flex;
  flex-direction: row;
  justify-content: flex-end;
  align-items: baseline;
  gap: 4px;
  direction: ltr;
  padding: 0;
  margin: 0;
  border: 0;
  text-align: right;
}
.prod-from-price {
  display: inline;
  direction: ltr;
  color: var(--pri);
  font-size: 15px;
  font-weight: 800;
}
.prod-from-label {
  display: inline;
  color: #4B5563;
  font-size: 12px;
  font-weight: 400;
}

/* Hairline rule under the price */
.prod-divider {
  align-self: stretch;
  height: 0;
  border-top: 1px solid #F3F4F6;
}

/* "6 موزعين" chip floating over the bottom-left of the image */
.dist-count {
  position: absolute;
  left: 12px;
  top: -30px;
  display: inline-flex;
  justify-content: center;
  align-items: center;
  padding: 4px 8px;
  border-radius: 6px;
  background: #EFF6FF;
  color: var(--pri);
  font-size: 11px;
  font-weight: 700;
  white-space: nowrap;
}
.dist-count svg { display: none; }

/* "متوفر الآن" with its status dot */
.prod-meta {
  align-self: stretch;
  display: flex;
  /* page is RTL, so flex-start resolves to the right edge (design: flex-end in LTR) */
  justify-content: flex-start;
  align-items: center;
  gap: 4px;
  margin: 0;
  min-height: 17px;
}
.avail-badge {
  display: inline-flex;
  flex-direction: row-reverse;
  align-items: center;
  gap: 4px;
  padding: 0;
  background: transparent;
  border-radius: 0;
  font-size: 11px;
  font-weight: 600;
}
.avail-badge::before {
  content: "";
  width: 6px;
  height: 6px;
  border-radius: 3px;
  background: currentColor;
  flex: none;
}
.avail-badge.good { color: var(--good); }
.avail-badge.warn { color: var(--warn); }
.avail-badge.bad  { color: var(--bad);  }

/* ─── Empty state ─── */
.empty {
  text-align: center;
  color: var(--mute);
  padding: 50px 20px;
}
.empty-icon {
  font-size: 48px;
  margin-bottom: 12px;
}
.empty p { margin: 0 0 16px; font-size: 15px; }

/* ─── Card container (general) ─── */
.card {
  background: var(--bg-white);
  border: 1px solid var(--line);
  border-radius: var(--radius-md);
  padding: 14px;
  margin-bottom: 12px;
  box-shadow: var(--shadow-md);
}
.card-title {
  font-size: 13px;
  font-weight: 700;
  color: var(--ink);
  margin-bottom: 10px;
  display: flex;
  align-items: center;
  gap: 6px;
}

/* ─── Buttons ─── */
.btn {
  border-radius: var(--radius-sm);
  background: var(--pri);
  color: #fff;
  padding: 10px 16px;
  font-size: 14px;
  font-weight: 700;
  display: inline-flex;
  align-items: center;
  justify-content: center;
  gap: 6px;
  transition: background .15s, transform .08s, box-shadow .15s;
  box-shadow: 0 2px 8px rgba(37,99,235,.25);
  min-height: 42px;
}
.btn:hover { background: var(--pri-dark); }
.btn:active { transform: scale(.97); }
.btn:disabled { opacity: .45; cursor: not-allowed; box-shadow: none; transform: none; }
.btn.outline {
  background: var(--bg-white);
  color: var(--pri);
  border: 1.5px solid var(--pri);
  box-shadow: none;
}
.btn.outline:hover { background: var(--pri-soft); }
.btn.ghost {
  background: var(--bg);
  color: var(--ink-sub);
  box-shadow: none;
}
.btn.ghost:hover { background: var(--line); }
.btn.full { width: 100%; padding: 14px; font-size: 16px; border-radius: var(--radius-md); }
.btn.success-ghost {
  background: var(--bg);
  color: var(--ink-sub);
  box-shadow: none;
  border: 1.5px solid var(--line);
}

/* ─── Footer action bar ─── */
.footer-bar {
  padding: 12px 16px;
  padding-bottom: calc(12px + env(safe-area-inset-bottom, 0px));
  background: var(--bg-white);
  border-top: 1px solid var(--line);
}

/* ─── Detail screen ───
   Matches "Dental Supplies design html/product-details.html" */
.hdr.detail-hdr { border-bottom: 1px solid #E2E8F0; }
.detail-hdr .hdr-title { color: #0F172A; font-size: 20px; font-weight: 700; }
.detail-hdr .hdr-btn {
  width: 40px;
  height: 40px;
  background: #F3F4F6;
  border-radius: 8px;
  color: #0F172A;
}
.detail-hdr .hdr-btn:hover { background: #E5E7EB; }
/* same 40px box as the back button so the title stays centred,
   but no filled container of its own */
.detail-hdr .hdr-share {
  width: 40px;
  height: 40px;
  background: transparent;
  border-radius: 8px;
  color: #0F172A;
}
.detail-hdr .hdr-share:hover { background: transparent; color: var(--pri); }
.detail-main {
  padding: 16px 16px 24px;
  display: flex;
  flex-direction: column;
  align-items: flex-start;
  gap: 20px;
}

/* Framed product image */
.detail-hero {
  align-self: stretch;
  height: 240px;
  padding: 16px;
  margin: 0;
  background: #fff;
  border: 0;
  outline: 1px solid #E2E8F0;
  outline-offset: -1px;
  border-radius: 12px;
  box-shadow: none;
  display: flex;
  justify-content: center;
  align-items: center;
}
.detail-hero-icon {
  flex: 1 1 0;
  align-self: stretch;
  width: auto;
  height: auto;
  margin: 0;
  border-radius: 8px;
  overflow: hidden;
  background: transparent;
}
.detail-hero-icon img { border-radius: 8px; }

/* Title block: category pill + name, then the spec line */
.detail-head {
  align-self: stretch;
  display: flex;
  flex-direction: column;
  align-items: flex-start;
  gap: 10px;
}
.detail-title-row {
  display: inline-flex;
  flex-direction: row;
  align-items: center;
  gap: 8px;
}
.detail-cat-pill {
  padding: 4px 10px;
  background: #EFF6FF;
  border-radius: 100px;
  color: var(--pri);
  font-size: 12px;
  font-weight: 600;
  white-space: nowrap;
}
.detail-hero-name {
  margin: 0;
  text-align: right;
  color: #0F172A;
  font-size: 22px;
  font-weight: 700;
}
.detail-hero-spec {
  align-self: stretch;
  margin: 0;
  text-align: right;
  color: #475569;
  font-size: 14px;
  font-weight: 400;
  line-height: 22.4px;
}

.detail-rule {
  align-self: stretch;
  height: 0;
  border-top: 1px solid #E2E8F0;
}

/* "قارن السعر بين الموزعين" */
.detail-section {
  align-self: stretch;
  display: flex;
  flex-direction: column;
  align-items: flex-start;
  gap: 12px;
}
.detail-section-title {
  margin: 0;
  text-align: right;
  color: #0F172A;
  font-size: 16px;
  font-weight: 700;
}
.offer-list {
  align-self: stretch;
  display: flex;
  flex-direction: column;
  align-items: flex-start;
  gap: 10px;
}

/* Selectable distributor row */
.offer-card {
  align-self: stretch;
  width: 100%;
  display: flex;
  flex-direction: row;
  align-items: center;
  gap: 12px;
  padding: 14px;
  margin: 0;
  text-align: right;
  background: #fff;
  border: 0;
  outline: 1px solid #E2E8F0;
  outline-offset: -1px;
  border-radius: 12px;
  box-shadow: 0 2px 8px rgba(15, 23, 42, .03);
  cursor: pointer;
  transition: outline-color .15s, background .15s;
}
.offer-card.sel {
  background: #ECFDF5;
  outline-color: #10B981;
  box-shadow: none;
}
.offer-card[disabled] { opacity: .55; cursor: not-allowed; }
.offer-card:focus-visible {
  outline-color: var(--pri);
  box-shadow: 0 0 0 3px rgba(37, 99, 235, .25);
}

/* right side: distributor name + rating */
.offer-main {
  display: inline-flex;
  flex-direction: column;
  align-items: flex-start;
  gap: 6px;
}
.offer-header {
  display: inline-flex;
  flex-direction: row;
  align-items: center;
  gap: 8px;
  margin: 0;
}
.offer-name {
  text-align: right;
  color: #0F172A;
  font-size: 14px;
  font-weight: 700;
}
.best-badge {
  padding: 4px 10px;
  border-radius: 100px;
  background: #ECFDF5;
  color: var(--good);
  font-size: 12px;
  font-weight: 600;
  white-space: nowrap;
}
/* the selected tile is also #ECFDF5, so invert the badge to keep it legible */
.offer-card.sel .best-badge { background: var(--good); color: #fff; }
.offer-rating {
  display: inline-flex;
  flex-direction: row-reverse;
  align-items: center;
  gap: 4px;
  color: #475569;
  font-size: 12px;
  font-weight: 600;
}
.offer-rating svg { flex: none; }

.offer-spacer { flex: 1 1 0; height: 1px; }

/* left side: radio, price, ETA */
.offer-aside {
  display: inline-flex;
  flex-direction: column;
  /* the ETA line is the widest child; flex-end is the LEFT edge under
     dir="rtl", so the radio and price sit flush left beneath it */
  align-items: flex-end;
  gap: 8px;
}
.offer-radio { display: flex; align-items: center; }
.offer-price {
  direction: ltr;
  color: var(--pri);
  font-size: 16px;
  font-weight: 700;
}
.offer-eta {
  display: inline-flex;
  align-items: center;
  gap: 4px;
  color: #475569;
  font-size: 11px;
  font-weight: 400;
  white-space: nowrap;
}
.offer-eta svg { flex: none; }
.offer-stk {
  font-size: 11px;
  font-weight: 600;
}
.offer-stk.good { color: var(--good); }
.offer-stk.warn { color: var(--warn); }
.offer-stk.bad  { color: var(--bad);  }

/* Sticky purchase bar */
.detail-bar {
  position: sticky;
  bottom: 0;
  z-index: 5;
  padding: 16px 20px 32px;
  background: #fff;
  border-top: 1px solid #E2E8F0;
  box-shadow: 0 -4px 16px rgba(15, 23, 42, .03);
  display: flex;
  flex-direction: column;
  align-items: flex-start;
  gap: 16px;
}
.detail-bar-row {
  align-self: stretch;
  display: flex;
  flex-direction: row-reverse;
  justify-content: space-between;
  align-items: center;
  padding-inline: 16px 8px;
}
.detail-total {
  direction: ltr;
  text-align: right;
  color: rgba(15, 23, 42, .90);
  font-size: 32px;
  font-weight: 700;
  line-height: 1.1;
}
.detail-bar .qty-ctrl {
  height: 60px;
  padding: 6px;
  display: flex;
  flex-direction: row-reverse;
  justify-content: space-between;
  align-items: center;
  gap: 0;
  background: #fff;
  border: 0;
  outline: 1px solid #E2E8F0;
  outline-offset: -1px;
  border-radius: 100px;
  overflow: visible;
}
.detail-bar .qty-btn {
  width: 48px;
  align-self: stretch;
  height: auto;
  display: grid;
  place-items: center;
  background: #EFF6FF;
  color: var(--pri);
  border-radius: 999px;
  font-size: 20px;
  font-weight: 700;
  transition: background .15s;
  flex: none;
}
.detail-bar .qty-btn.minus, .detail-bar .qty-btn.plus { background: #EFF6FF; color: var(--pri); }
.detail-bar .qty-btn:hover.minus, .detail-bar .qty-btn:hover.plus { background: #DBEAFE; }
.detail-bar .qty-btn[disabled] { opacity: .45; cursor: not-allowed; }
.detail-bar .qty-num {
  width: 48px;
  text-align: center;
  color: #0F172A;
  font-size: 24px;
  font-weight: 700;
}
.detail-add {
  align-self: stretch;
  width: 100%;
  height: 48px;
  display: inline-flex;
  flex-direction: row-reverse;
  justify-content: center;
  align-items: center;
  gap: 8px;
  background: var(--pri);
  color: #fff;
  border-radius: 12px;
  box-shadow: 0 4px 12px rgba(37, 99, 235, .20);
  font-size: 16px;
  font-weight: 700;
}
.detail-add[disabled] {
  background: #CBD5E1;
  box-shadow: none;
  cursor: not-allowed;
}
/* cart glyph reacts when something is added */
@keyframes cart-pop {
  0%   { transform: scale(1)    rotate(0deg); }
  25%  { transform: scale(1.35) rotate(-10deg); }
  55%  { transform: scale(.92)  rotate(6deg); }
  80%  { transform: scale(1.1)  rotate(-3deg); }
  100% { transform: scale(1)    rotate(0deg); }
}
.cart-ico { transform-origin: center; }

/* ─── Cart ───

.hdr.cart-hdr { height: 54px; padding: 0 16px; gap: 12px; border-bottom: 1px solid #E5E7EB; }
.cart-hdr .hdr-title { color: #111827; font-size: 20px; font-weight: 700; }

.cart-main {

.cart-group-hdr {

  gap: 8px;
}
.cart-group-dist {

}
.cart-group-dist svg { color: var(--pri); flex: none; }
.cart-group-eta { color: #6B7280; font-size: 10px; font-weight: 500; }

/* the card holding that distributor's lines */
.cart-card {
  align-self: stretch;
  background: #fff;
  border: 0;
  border-radius: 12px;

  padding: 0;
}
.cart-row {

/* 56x64 product thumbnail, sits on the right in RTL */
.cart-thumb {

  border: 1px solid #E5E7EB;

.cart-row-info {

}
.cart-row-name {
  align-self: stretch;
  text-align: right;

/* dot sits to the right of the label, as in the design */
.cart-row-stock {
  display: inline-flex;
  align-items: center;
  gap: 4px;
  font-size: 10px;
  font-weight: 600;
}
.cart-row-stock::before {
  content: "";
  width: 6px;
  height: 6px;
  border-radius: 3px;
  background: currentColor;
  flex: none;
  order: -1;
}
.cart-row-stock.good { color: var(--good); }
.cart-row-stock.warn { color: var(--warn); }
.cart-row-stock.bad  { color: var(--bad);  }

/* price + stepper, left edge of the row in RTL */
.cart-row-side {
  width: 82px;
  flex: none;
  display: flex;
  flex-direction: column;
  align-items: flex-end;   /* flex-end is the LEFT edge under dir="rtl" */
  gap: 6px;
  overflow: hidden;
}
.cart-row-price {
  direction: ltr;
  color: #111827;
  font-size: 12px;
  font-weight: 700;
}
.cart-card .qty-ctrl {
  height: 28px;
  padding: 0;
  display: flex;
  flex-direction: row-reverse;   /* minus on the left, plus on the right */
  align-items: center;
  gap: 0;
  background: #F3F4F6;
  border: 0;
  border-radius: 8px;
  overflow: hidden;
}
.cart-card .qty-btn {
  width: 26px;
  height: 28px;
  display: grid;
  place-items: center;
  background: transparent;
  color: #6B7280;
  border-radius: 0;
  flex: none;
  transition: background .15s;
}
.cart-card .qty-btn:hover { background: #E5E7EB; }
.cart-card .qty-num {
  width: 24px;
  text-align: center;
  color: #111827;
  font-size: 12px;
  font-weight: 700;
}

/* summary + CTA pinned to the bottom of the scroll area */
.cart-foot {
  align-self: stretch;
  margin-top: auto;
  padding-top: 16px;
  display: flex;
  flex-direction: column;
  gap: 12px;
}
.cart-cta {
  align-self: stretch;
  width: 100%;
  height: 52px;
  padding: 0 16px;
  display: inline-flex;
  flex-direction: row-reverse;   /* icon to the left of the label */

  align-items: center;

}
.cart-cta:hover { background: #1D4ED8; }

/* ─── Order summary ─── */

}
/* icon on the right, heading to its left */

.summary-total {

  padding: 0;

  font-size: 15px;
  font-weight: 700;
}
.summary-total .val { color: #111827; direction: ltr; }

/* ─── Checkout ───

/* ─── Track order ───
   Matches "Dental Supplies design html/track-order.html" */
.hdr.tr-hdr { height: 54px; padding: 0 16px; gap: 12px; border-bottom: 1px solid #E5E7EB; }
.tr-hdr .hdr-title { color: #111827; font-size: 20px; font-weight: 700; }
.tr-hdr .hdr-btn {

  height: 32px;
  background: #F3F4F6;
  border-radius: 8px;

.tr-hdr .hdr-btn:hover { background: #E5E7EB; }

  flex-direction: column;

  display: flex;
  align-items: center;

.tr-eta-cell {
  display: flex;
  flex-direction: column;
  align-items: stretch;
  gap: 4px;
  min-width: 0;
}
.tr-eta-cell.num { flex: 1; }
.tr-eta-cell.when { width: 142px; flex: none; }
.tr-eta-k {
  text-align: right;
  font-size: 11px;
  font-weight: 500;
  color: #6B7280;
}
.tr-eta-no {
  text-align: right;
  font-size: 17px;
  font-weight: 800;
  color: #111827;
  direction: ltr;
}
.tr-eta-v {
  text-align: right;
  font-size: 14px;
  font-weight: 700;
  color: #2563EB;
}
.tr-eta-sep {
  width: 1px;
  height: 42px;
  background: #BFDBFE;
  flex: none;
}

/* delivery timeline */
.tr-card {
  padding: 12px 14px;
  background: #fff;
  border: 1px solid #E5E7EB;
  border-radius: 12px;
  box-shadow: 0 3px 12px rgba(15, 23, 42, .05);
  display: flex;
  flex-direction: column;
  gap: 8px;
}
.tr-card-head {
  height: 26px;
  display: flex;
  align-items: center;
  justify-content: space-between;
}
.tr-card-title { font-size: 14px; font-weight: 700; color: #111827; }

  color: #2563EB;
  font-size: 10px;

  align-items: flex-start;
  gap: 10px;
  min-height: 62px;
}
.tr-step:last-child { min-height: 30px; }
/* rail: node + connector, first in DOM so it sits on the right under RTL */
.tr-rail {
  width: 32px;
  flex: none;
  align-self: stretch;
  display: flex;
  flex-direction: column;
  align-items: center;
}
.tr-node {
  width: 30px;
  height: 30px;
  border-radius: 999px;
  flex: none;
  display: flex;
  align-items: center;
  justify-content: center;
}
.tr-node.done    { background: #10B981; color: #fff; }
.tr-node.active  { background: #2563EB; color: #fff; outline: 4px solid #BFDBFE; outline-offset: -4px; }
.tr-node.pending { background: #F3F4F6; color: #9CA3AF; }
.tr-link {
  width: 2px;
  flex: 1;
  min-height: 32px;
  border-radius: 1px;
}
.tr-link.done    { background: #10B981; }
.tr-link.pending { background: #BFDBFE; }
.tr-body {
  flex: 1;
  min-width: 0;
  padding-top: 1px;
  display: flex;
  flex-direction: column;
  align-items: stretch;
  gap: 5px;
}
.tr-label {
  text-align: right;
  font-size: 14px;
  font-weight: 600;
  line-height: 18.9px;
  color: #111827;
}
.tr-label.active  { font-weight: 700; }
.tr-label.pending { color: #9CA3AF; }
.tr-when {
  display: flex;
  align-items: center;
  gap: 5px;
  font-size: 11px;
  font-weight: 400;
  color: #6B7280;
}
.tr-when svg { flex: none; display: block; }
.tr-when.active  { color: #2563EB; font-weight: 600; }
.tr-when.pending { color: #9CA3AF; }

/* courier card */
.tr-driver {
  padding: 14px;
  background: #F3F4F6;
  border-radius: 12px;
  display: flex;
  flex-direction: column;
  gap: 10px;
}
.tr-driver-head {
  display: flex;
  align-items: center;
  justify-content: space-between;
}
.tr-driver-k { font-size: 12px; font-weight: 700; color: #6B7280; }

  align-items: center;
  gap: 5px;
  font-size: 11px;
  font-weight: 600;
  color: #10B981;

  content: "";
  width: 7px;
  height: 7px;
  border-radius: 50%;
  background: #10B981;
  flex: none;

.tr-driver-row {
  display: flex;
  align-items: center;
  gap: 10px;
}

  width: 48px;

  align-items: center;
  justify-content: center;

  flex-direction: column;
  align-items: stretch;
  gap: 3px;

.tr-driver-name {
  text-align: right;
  font-size: 14px;
  font-weight: 700;
  color: #111827;
}
.tr-driver-tel {
  text-align: right;
  font-size: 10px;
  font-weight: 500;
  color: #6B7280;
  direction: ltr;
}
.tr-call {
  width: 84px;
  height: 40px;
  flex: none;
  border: 0;
  border-radius: 10px;
  background: #2563EB;
  color: #fff;
  font: inherit;
  font-size: 12px;
  font-weight: 700;
  display: flex;
  flex-direction: row-reverse;
  align-items: center;
  justify-content: center;

  display: flex;
  align-items: center;
  justify-content: center;

/* ─── Order Confirmation / Tracking ─── */
.success-wrap {
  text-align: center;
  padding: 20px 0 10px;
}
.success-circle {
  width: 80px;
  height: 80px;
  border-radius: 50%;
  background: var(--good-bg);
  display: grid;
  place-items: center;
  margin: 0 auto 14px;
  border: 3px solid #fff;
  box-shadow: 0 4px 16px rgba(16,185,129,.25);
}
.success-h {
  font-size: 20px;
  font-weight: 800;
  color: var(--ink);
  margin: 0 0 6px;
}
.success-sub {
  font-size: 13px;
  color: var(--mute);
  margin: 0 0 20px;
}

/* Timeline */
.timeline { position: relative; }
.tl-step {
  display: flex;
  gap: 12px;
  padding-bottom: 0;
  position: relative;
}
.tl-step:not(:last-child) { padding-bottom: 0; }
.tl-col {
  display: flex;
  flex-direction: column;
  align-items: center;
  flex: none;
  width: 30px;
}
.tl-dot {
  width: 30px;
  height: 30px;
  border-radius: 50%;
  display: grid;
  place-items: center;
  flex: none;
  z-index: 1;
  font-size: 13px;
  font-weight: 700;
}
.tl-dot.done {
  background: var(--good);
  color: #fff;
}
.tl-dot.active {
  background: var(--pri);
  color: #fff;
  outline: 4px solid var(--pri-border);
  outline-offset: -4px;
}
.tl-dot.pending {
  background: var(--bg);
  color: var(--mute);
  border: 2px solid var(--line);
}
.tl-line {
  width: 2px;
  flex: 1;
  min-height: 28px;
  margin: 2px 0;
  border-radius: 1px;
}
.tl-line.done  { background: var(--good); }
.tl-line.pending { background: var(--line); }

.tl-body {
  flex: 1;
  padding-top: 4px;
  padding-bottom: 20px;
}
.tl-title {
  font-size: 14px;
  font-weight: 700;
  color: var(--ink);
  line-height: 1.4;
}
.tl-title.pending { color: var(--mute); }

/* ─── MVP visual language from the design screens ─── */
:root {
  --ink: #1F2937;
  --ink-sub: #4B5563;
  --mute: #6B7280;
  --line: #E5E7EB;
  --bg: #F8FAFC;
  --pri: #2563EB;
  --pri-soft: #EFF6FF;
  --pri-border: #BFDBFE;
  --radius-sm: 8px;
  --radius-md: 12px;
  --radius-lg: 16px;
  --shadow-md: 0 4px 12px rgba(0,0,0,.04);
}
body { background: #eef2f7; font-family: 'Cairo', Tahoma, sans-serif; }
.app { max-width: 402px; background: var(--bg); box-shadow: 0 0 35px rgba(15,23,42,.08); }
.hdr { height: 66px; padding: 0 24px; border-bottom: 0; }
.hdr-title { color: var(--pri); font-size: 20px; font-weight: 700; }
.hdr-logo { width: 32px; height: 32px; border-radius: 10px; overflow: hidden; background: var(--pri); }
.hdr-logo img { width: 100%; height: 100%; object-fit: cover; }
.hdr-btn { width: 40px; height: 40px; border-radius: 50%; background: #F3F4F6; }
main { padding: 10px 24px 18px; background: var(--bg); }
.search-wrap { margin: 0 0 16px; }
.search { padding: 12px 42px 12px 14px; border: 0; border-radius: 10px; background: #F3F4F6; box-shadow: none; }
.search:focus { background: #fff; }
.chips { gap: 8px; padding: 0 0 20px; }
.chip { padding: 7px 13px; border: 0; background: #F3F4F6; color: var(--ink-sub); border-radius: 7px; font-size: 12px; font-weight: 600; }
.chip.on { background: var(--pri); box-shadow: none; }
#l { display: grid; grid-template-columns: repeat(2, minmax(0, 1fr)); gap: 14px; }
.nav { height: 68px; padding: 10px 24px 0; border-top: 1px solid var(--line); justify-content: space-around; }
.nav-item { flex: 0 0 70px; padding: 0; gap: 4px; font-size: 11px; font-weight: 500; }
.nav-item.active { color: var(--pri); font-weight: 700; }
.nav-item svg { width: 22px; height: 22px; }
.card { box-shadow: 0 4px 12px rgba(0,0,0,.03); }
@media (min-width: 500px) { .app { border-inline: 0; } }
@media (max-width: 360px) { main { padding-inline: 16px; } .hdr { padding-inline: 16px; } #l { gap: 10px; } }

/* Small interaction and RTL polish */
.search { border-radius: 999px; }
.search-icon { inset-inline-end: auto; inset-inline-start: 12px; }
.chip { border-radius: 999px; }

/* Reference-screen details: visible controls, consistent borders and hierarchy */
.hdr-title { color: #111827; }
.hdr.home-hdr { justify-content: space-between; }
.brand-lockup { display: flex; align-items: center; gap: 8px; direction: rtl; }
.brand-lockup .hdr-logo { flex: none; }
.home-title { margin: 0; color: var(--pri); font-size: 20px; font-weight: 700; line-height: 1; }
.notification-btn { color: #1F2937; }
.search { border: 1px solid #E5E7EB; background: #F3F4F6; }
.chip { border: 1px solid #E5E7EB; background: #F3F4F6; color: #4B5563; }
.chip.on { border-color: var(--pri); background: var(--pri); color: #fff; }

/* The reference screens are phone-sized, but the live demo should use a tablet viewport well. */
@media (min-width: 600px) {
  body { background: #F8FAFC; }
  .app { width: 100%; max-width: none; min-height: 100vh; box-shadow: none; }
  .hdr { padding-inline: clamp(24px, 6vw, 72px); }
  main { padding-inline: clamp(24px, 6vw, 72px); }
  #l { grid-template-columns: repeat(3, minmax(0, 1fr)); gap: 18px; }
  .prod-icon { height: 150px; }
  .nav { padding-inline: clamp(24px, 6vw, 72px); }
}
@media (min-width: 960px) {
  #l { grid-template-columns: repeat(4, minmax(0, 1fr)); }
  .prod-icon { height: 170px; }
}

/* Tablet shell: use the complete viewport rather than the phone preview width. */
html, body { width: 100%; min-width: 100%; }
body, .app, main { background: #fff; }
@media (min-width: 431px) {
  body { background: #fff; }
  .app { width: 100%; max-width: none; margin-inline: 0; border-inline: 0; box-shadow: none; }
}

.prod-icon img { width: 100%; height: 100%; object-fit: cover; display: block; }
.detail-hero-icon img { width: 100%; height: 100%; object-fit: cover; border-radius: 8px; display: block; }
</style>

];

function go(s, pid) {
  S.screen=s;
  if(pid!==undefined) S.pid=pid;
  // entering a product: preselect the cheapest in-stock distributor, reset qty
  if (s==="detail" && S.pid!==null) { S.sel = bestOffer(prods[S.pid]); S.qty = 1; }
  render();
}
function add(pid, d, qty=1) {
  const o = prods[pid].offers.find(o=>o.d===d);
  const c = S.cart.find(c=>c.pid===pid && c.d===d);
  c ? c.qty += qty : S.cart.push({pid,d,qty,price:o.price});
}
/* index of the cheapest in-stock offer, falling back to the first one */
function bestOffer(p) {
  let bi = -1;
  p.offers.forEach((o,i) => { if (o.stock>0 && (bi<0 || o.price<p.offers[bi].price)) bi=i; });
  return bi<0 ? 0 : bi;
}
function pick(i) {
  if (S.sel === i) return;
  S.sel = i;
  patchDetail();
}
function qchg(n) {
  const q = Math.min(99, Math.max(1, S.qty + n));
  if (q === S.qty) return;
  S.qty = q;
  patchDetail();
}
/* Update only the bits of the detail screen that actually changed. A full
   render() would replace every <img> and make the photos visibly reload. */
function patchDetail() {
  const p = prods[S.pid];
  if (!p) return;
  document.querySelectorAll(".offer-card").forEach((el, i) => {
    const on = i === S.sel;
    el.classList.toggle("sel", on);
    el.setAttribute("aria-checked", String(on));
    const r = el.querySelector(".offer-radio");
    if (r) r.innerHTML = iconRadio(on, !p.offers[i].stock);
  });
  const sel = p.offers[S.sel];
  const canBuy = !!(sel && sel.stock);
  const num   = document.querySelector(".detail-bar .qty-num");
  const minus = document.querySelector(".detail-bar .qty-btn.minus");
  const plus  = document.querySelector(".detail-bar .qty-btn.plus");
  const total = document.querySelector(".detail-total");
  const addBt = document.querySelector(".detail-add");
  if (num)   num.textContent = S.qty;
  if (minus) minus.disabled  = S.qty <= 1;
  if (plus)  plus.disabled   = S.qty >= 99;
  if (total) total.textContent = canBuy ? $(sel.price*S.qty) : "—";
  if (addBt) addBt.disabled  = !canBuy;
}
/* Keep the nav badge in sync without rebuilding the screen. */
function syncCartBadge() {
  const n = cnt();
  document.querySelectorAll(".nav-item").forEach(item => {

    let b = item.querySelector(".nav-badge");
    if (n && !b) {
      b = document.createElement("span");
      b.className = "nav-badge";
      b.setAttribute("aria-hidden", "true");
      item.insertBefore(b, item.lastElementChild);
    }
    if (b) { n ? b.textContent = n : b.remove(); }
  });
}
/* Nudge every visible cart glyph so the user sees the item land. */
function bumpCart() {
  document.querySelectorAll(".cart-ico").forEach(el => {
    el.classList.remove("cart-pop");
    void el.getBoundingClientRect();   // force reflow so the animation restarts
    el.classList.add("cart-pop");
  });
}

  const p = prods[S.pid], o = p.offers[S.sel];
  if (!o || !o.stock) return;
  add(p.id, o.d, S.qty);
  syncCartBadge();
  bumpCart();
}

/* Identify lines by pid+distributor rather than array index, so removing one
   line never invalidates the handlers on the others. */
function chgItem(pid, d, n) {
  const i = S.cart.findIndex(c => c.pid === pid && c.d === d);
  if (i < 0) return;
  const c = S.cart[i];
  c.qty += n;
  if (c.qty < 1) {
    S.cart.splice(i, 1);
    if (!S.cart.length) { render(); return; }   // swap in the empty state
    dropCartRow(pid, d);
  }
  patchCart();
  syncCartBadge();
}
/* Remove just that row (and its separator, and the group if now empty)
   instead of rebuilding the screen, so the other thumbnails never reload. */
function dropCartRow(pid, d) {
  const row = document.querySelector(`.cart-row[data-row="${pid}|${d}"]`);
  if (!row) return;
  const sep = row.nextElementSibling && row.nextElementSibling.classList.contains("cart-row-sep")
    ? row.nextElementSibling
    : (row.previousElementSibling && row.previousElementSibling.classList.contains("cart-row-sep")
        ? row.previousElementSibling : null);
  const card = row.closest(".cart-card");
  if (sep) sep.remove();
  row.remove();
  if (card && !card.querySelector(".cart-row")) {
    const group = card.closest(".cart-group");
    if (group) group.remove();
  }
}
/* Refresh the numbers that changed. No innerHTML on the screen root. */
function patchCart() {
  S.cart.forEach(c => {
    const key = `${c.pid}|${c.d}`;
    const q = document.querySelector(`[data-qty="${key}"]`);
    const l = document.querySelector(`[data-line="${key}"]`);
    if (q) q.textContent = c.qty;
    if (l) l.textContent = $(c.price*c.qty);
  });
  const s = sub(), f = fee();
  const set = (k, v) => {
    const el = document.querySelector(`[data-sum="${k}"]`);
    if (el) el.textContent = $(v);
  };
  set("sub", s); set("fee", f); set("total", s+f);
}

/* ── Track order ── */
/* The order is anchored to real timestamps the moment it is placed, so every
   time shown on this screen is live and the timeline advances on its own. */
let ORDER = null;
let ordSeq = 0;

function placeOrder() {
  const t = Date.now();
  ORDER = {
    id: "DEN-" + (28491 + ordSeq++),
    lines: S.cart.length,
    total: sub() + fee(),
    received:  t - 3 * 3600e3 - 14 * 60e3,
    prepared:  t - 2 * 3600e3 - 27 * 60e3,
    shipped:   t - 8 * 60e3,
    eta:       t + 22 * 60e3,
    driver: { name: "محمود الأنصاري", tel: "+963 944 318 275" }
  };
}

const AR_MER = h => (h < 12 ? "ص" : "م");
function fmtTime(ms) {
  const d = new Date(ms), m = String(d.getMinutes()).padStart(2, "0");
  return `${d.getHours() % 12 || 12}:${m} ${AR_MER(d.getHours())}`;
}
function dayWord(ms) {
  const d = new Date(ms), n = new Date();
  const same = (a, b) => a.toDateString() === b.toDateString();
  if (same(d, n)) return "اليوم";
  const y = new Date(n); y.setDate(n.getDate() - 1);
  if (same(d, y)) return "أمس";
  const w = new Date(n); w.setDate(n.getDate() + 1);
  if (same(d, w)) return "غداً";
  return `${d.getDate()}/${d.getMonth() + 1}`;
}
const stamp = ms => `${dayWord(ms)}، ${fmtTime(ms)}`;
/* "منذ 8 دقائق" with correct Arabic duals and plurals */
function since(ms) {
  const mins = Math.max(0, Math.round((Date.now() - ms) / 60e3));
  if (mins < 1)  return "الآن";
  if (mins < 60) {
    const t = mins === 1 ? "دقيقة" : mins === 2 ? "دقيقتين" : mins <= 10 ? `${mins} دقائق` : `${mins} دقيقة`;
    return "منذ " + t;
  }
  const h = Math.round(mins / 60);
  return "منذ " + (h === 1 ? "ساعة" : h === 2 ? "ساعتين" : h <= 10 ? `${h} ساعات` : `${h} ساعة`);
}

function orderSteps() {
  if (!ORDER) placeOrder();
  const now = Date.now();
  const raw = [
    { label: "تم استلام الطلب", at: ORDER.received, icon: iconPkgCheck, node: iconTick,       when: t => stamp(t) },
    { label: "جاري التجهيز",    at: ORDER.prepared, icon: iconLayers,   node: iconTick,       when: t => stamp(t) },
    { label: "في الطريق إليك",  at: ORDER.shipped,  icon: iconTruckSm,  node: () => iconSend(14, 2.4),
      when: t => `${since(t)} · الوصول ${fmtTime(ORDER.eta)}` },
    { label: "تم التسليم",      at: ORDER.eta,      icon: iconHomeSm,   node: iconCircleOpen, when: t => stamp(t) }
  ];
  const reached = raw.filter(r => r.at <= now).length;
  return raw.map((r, i) => ({
    ...r,
    state: r.at > now ? "pending" : (i === reached - 1 ? "active" : "done"),
    text:  r.at > now ? (i === reached ? "قريبًا" : "—") : r.when(r.at)
  }));
}

function trackEtaHTML() {
  if (!ORDER) placeOrder();
  return `
    <div class="tr-eta-cell num">
      <div class="tr-eta-k">رقم الطلب</div>
      <div class="tr-eta-no">#${ORDER.id}</div>
    </div>
    <div class="tr-eta-sep" aria-hidden="true"></div>
    <div class="tr-eta-cell when">
      <div class="tr-eta-k">الوصول المتوقع</div>
      <div class="tr-eta-v">${stamp(ORDER.eta)}</div>
    </div>`;
}

function trackStepsHTML() {
  const steps = orderSteps();
  return steps.map((s, i) => {
    const last = i === steps.length - 1;
    const link = s.state === "done" ? "done" : "pending";
    return `
    <div class="tr-step" role="listitem">
      <div class="tr-rail" aria-hidden="true">
        <span class="tr-node ${s.state}">${s.node()}</span>
        ${last ? "" : `<span class="tr-link ${link}"></span>`}
      </div>
      <div class="tr-body">
        <div class="tr-label ${s.state}">${s.label}</div>
        <div class="tr-when ${s.state}">${s.icon()}<span>${s.text}</span></div>
      </div>
    </div>`;
  }).join("");
}

function trackChipHTML() {
  const steps = orderSteps();
  return `${steps.filter(s => s.state !== "pending").length} من ${steps.length}`;
}

function screenTrack() {
  if (!ORDER) placeOrder();
  const d = ORDER.driver;
  const initials = d.name.split(/\s+/).slice(0, 2).map(w => w.replace(/^ال/, "")[0]).join(" ");
  return `
  <header class="hdr tr-hdr" role="banner">
    <button class="hdr-btn" onclick="go('done')" aria-label="رجوع">${iconBack(22)}</button>
    <h1 class="hdr-title">تتبع الطلب</h1>
    <div class="hdr-spacer"></div>
  </header>
  <main class="tr-main">
    <section class="tr-eta" id="trEta">${trackEtaHTML()}</section>

    <section class="tr-card">
      <div class="tr-card-head">
        <h2 class="tr-card-title">حالة التوصيل</h2>
        <span class="tr-chip" id="trChip">${trackChipHTML()}</span>
      </div>
      <div class="tr-steps" id="trSteps" role="list">${trackStepsHTML()}</div>
    </section>

    <section class="tr-driver">
      <div class="tr-driver-head">
        <span class="tr-driver-k">الموزع المسؤول</span>
        <span class="tr-online">متاح الآن</span>
      </div>
      <div class="tr-driver-row">
        <span class="tr-avatar" aria-hidden="true">${initials}</span>
        <div class="tr-driver-info">
          <div class="tr-driver-name">${d.name}</div>
          <div class="tr-driver-tel">${d.tel}</div>
        </div>
        <a class="tr-call" href="tel:${d.tel.replace(/\s/g, "")}" aria-label="الاتصال بالموزع">
          ${iconPhoneLg()}اتصال
        </a>
      </div>
    </section>

    <a class="tr-support" href="tel:+963115000000">
      ${iconSupport()}تحتاج مساعدة؟ تواصل مع الدعم
    </a>
  </main>`;
}

/* keep the relative times and the step states live without touching the rest */
function patchTrack() {
  if (S.screen !== "track" || !ORDER) return;
  const e = document.getElementById("trEta");
  const c = document.getElementById("trChip");
  const t = document.getElementById("trSteps");
  if (e) e.innerHTML = trackEtaHTML();
  if (c) c.textContent = trackChipHTML();
  if (t) t.innerHTML = trackStepsHTML();
}
setInterval(patchTrack, 30e3);

function screenDone() {
  const steps = [
    { label:"تم استلام الطلب بواسطة الموردين", done: true,  active: false },
    { label:"جاري تجهيز الشحنة والتغليف",       done: true,  active: false },
    { label:"السائق في الطريق إلى العيادة",       done: false, active: false }
  ];
  const tlHTML = steps.map((s, i) => {
    const isLast = i === steps.length - 1;
    const dotClass = s.done ? "done" : (s.active ? "active" : "pending");
    const lineClass = s.done ? "done" : "pending";
    const titleClass = (!s.done && !s.active) ? "pending" : "";
    return `
    <div class="tl-step">
      <div class="tl-col">
        <div class="tl-dot ${dotClass}" aria-label="${s.done?'مكتمل':'في الانتظار'}">
          ${s.done ? iconCheck(14) : (s.active ? iconCheck(14) : "")}
        </div>
        ${!isLast ? `<div class="tl-line ${lineClass}"></div>` : ""}
      </div>
      <div class="tl-body">
        <div class="tl-title ${titleClass}">${s.label}</div>
      </div>
    </div>`;
  }).join("");

  return `
  <header class="hdr" role="banner">
    <div class="hdr-spacer"></div>
    <h1 class="hdr-title">تأكيد الطلب والمتابعة</h1>
    <div class="hdr-spacer"></div>
  </header>
  <main>
    <div class="success-wrap">
      <div class="success-circle" aria-label="تم تأكيد الطلب بنجاح">
        <svg width="40" height="40" viewBox="0 0 24 24" fill="none" stroke="var(--good)" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round">
          <polyline points="20 6 9 17 4 12"/>
        </svg>
      </div>
      <h2 class="success-h">تم استلام طلبك بنجاح</h2>
      <p class="success-sub">سيتواصل معك الموردون قريباً</p>
    </div>
    <div class="card">
      <div class="card-title">حالة التوصيل</div>
      <div class="timeline" role="list" aria-label="مراحل الطلب">
        ${tlHTML}
      </div>
    </div>
  </main>
  <div class="footer-bar" style="display:flex;flex-direction:column;gap:8px">
    <button class="co-confirm" onclick="go('track')" aria-label="تتبع الطلب">
      ${iconTruckSm(18)}تتبع الطلب
    </button>
    <button
      class="btn full success-ghost"
      onclick="S.cart=[];S.q='';S.cat=-1;go('home')"
      aria-label="بدء طلب جديد">
      طلب جديد
    </button>
  </div>`;
}

/* ══════════════════════════════════════════════
   RENDER
══════════════════════════════════════════════ */
function render(keep) {
  const a = document.getElementById("app");
  const prevScrollTop = keep ? (document.querySelector("main") || {}).scrollTop : 0;

  let h = "";
  if      (S.screen === "home")     h = screenHome();
  else if (S.screen === "detail")   h = screenDetail();
  else if (S.screen === "cart")     h = screenCart();
  else if (S.screen === "checkout") h = screenCheckout();
  else if (S.screen === "track")    h = screenTrack();
  else                               h = screenDone();

  a.innerHTML = h;

  // Restore scroll
  const m = a.querySelector("main");
  if (m && prevScrollTop) m.scrollTop = prevScrollTop;

  // Wire up search
  const qi = document.getElementById("q");
  if (qi) {
    const update = () => {
      S.q = qi.value;
      applyFilter();
    };
    qi.addEventListener("input",  update);
    qi.addEventListener("search", update);
    qi.addEventListener("keydown", e => { if (e.key==="Enter") { update(); qi.blur(); } });
    if (keep) qi.focus();
  }
}

render();
</script>
</body>
</html>
