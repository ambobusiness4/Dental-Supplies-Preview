<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>معاينة: مستلزمات الأسنان</title>
<meta name="theme-color" content="#0a5fa8">
<link rel="icon" href="assets/favicon.svg" type="image/svg+xml">
<link href="https://fonts.googleapis.com/css2?family=Tajawal:wght@400;500;700;800&display=swap" rel="stylesheet">
<link rel="manifest" href="/manifest.json">
<style>
:root{color-scheme:light;
--bg:#eef6fc;--bg-soft:#e3f1fb;--card:#ffffff;--ink:#0d2b3e;--mute:#5b7c93;--line:#d7e7f3;
--pri:#0d7bd6;--pri-dark:#0a5fa8;--pri-light:#2f97e8;--pri-ink:#ffffff;--pri-soft:#e5f2fd;
--accent:#00b4c6;--good:#158a5c;--good-bg:#dff5ea;--warn:#b0710a;--warn-bg:#fdf0dd;--bad:#c72e26;--bad-bg:#fbe4e2;--chip:#e7f2fb;
box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
html{scroll-padding-top:env(safe-area-inset-top,0px)}
*{box-sizing:border-box}
html,body{height:100%;margin:0}
body{background:linear-gradient(180deg,var(--bg-soft),var(--bg) 220px);color:var(--ink);font-family:Tajawal,"Segoe UI",Tahoma,sans-serif;font-size:15px}
button,input{font:inherit;color:inherit}
button{cursor:pointer}
.app{max-width:430px;height:100%;margin:0 auto;display:flex;flex-direction:column;background:transparent;position:relative}
@media(min-width:500px){.app{border-inline:1px solid var(--line);box-shadow:0 0 40px rgba(13,123,214,.08)}}
header{display:flex;align-items:center;gap:10px;padding:14px;background:linear-gradient(135deg,var(--pri-dark),var(--pri) 60%,var(--pri-light));color:#fff;box-shadow:0 2px 10px rgba(10,95,168,.25)}
header h1{font-size:18px;font-weight:800;margin:0;flex:1;color:#fff}
.logo{width:34px;height:34px;border-radius:10px;background:rgba(255,255,255,.18);display:grid;place-items:center;font-size:18px;flex:none}
.ib{position:relative;width:40px;height:40px;border-radius:12px;border:1px solid rgba(255,255,255,.35);background:rgba(255,255,255,.12);font-size:18px;color:#fff}
.cnt{position:absolute;top:-6px;inset-inline-start:-6px;background:var(--accent);color:#fff;border-radius:10px;min-width:20px;height:20px;font-size:12px;font-weight:700;display:grid;place-items:center;border:2px solid var(--pri-dark)}
main{flex:1;overflow-y:auto;padding:14px}
.search{width:100%;padding:12px 14px;border-radius:12px;border:1px solid var(--line);background:var(--card);box-shadow:0 1px 3px rgba(13,123,214,.06)}
.search:focus{outline:none;border-color:var(--pri);box-shadow:0 0 0 3px var(--pri-soft)}
.chips{display:flex;gap:8px;overflow-x:auto;padding:12px 0;scrollbar-width:none}
.chip{white-space:nowrap;padding:8px 14px;border-radius:20px;border:1px solid var(--line);background:var(--chip);color:var(--pri-dark);font-weight:500}
.chip.on{background:var(--pri);color:var(--pri-ink);border-color:var(--pri);box-shadow:0 2px 6px rgba(13,123,214,.35)}
.card{background:var(--card);border:1px solid var(--line);border-radius:14px;padding:12px;margin-bottom:10px;box-shadow:0 1px 4px rgba(13,60,100,.05)}
.prod{display:flex;gap:12px;align-items:center;width:100%;text-align:start;background:var(--card);color:inherit}
.th{width:64px;height:64px;border-radius:12px;display:grid;place-items:center;font-weight:800;font-size:22px;background:var(--pri-soft);color:var(--pri);flex:none}
.t{font-weight:700;line-height:1.4}
.tag{display:inline-block;font-size:12px;color:var(--mute);margin-top:2px}
.unit{font-size:13px;color:var(--mute)}
.from{margin-inline-start:auto;text-align:end;font-size:12px;color:var(--mute);flex:none}
.from b{display:block;font-size:16px;color:var(--ink)}
.row{display:flex;align-items:center;gap:10px}
.offer{display:flex;align-items:center;gap:10px;flex-wrap:wrap}
.offer .n{font-weight:700;flex:1;color:var(--pri-dark)}
.px{font-weight:800;font-size:18px;color:var(--ink)}
.badge{font-size:12px;font-weight:700;padding:3px 8px;border-radius:8px;background:var(--good-bg);color:var(--good)}
.stk{font-size:12px}
.btn{border:0;border-radius:12px;background:var(--pri);color:var(--pri-ink);padding:11px 16px;font-weight:700;box-shadow:0 2px 8px rgba(13,123,214,.3);transition:transform .08s ease}
.btn:active{transform:scale(.97)}
.btn:disabled{opacity:.4;cursor:not-allowed;box-shadow:none}
.btn.sec{background:var(--chip);color:var(--pri-dark);box-shadow:none}
.big{width:100%;padding:14px;font-size:16px}
.qty{display:flex;align-items:center;gap:10px}
.qty button{width:32px;height:32px;border-radius:10px;border:1px solid var(--line);background:var(--card);color:var(--pri);font-size:18px}
.dist{display:inline-block;font-size:12px;padding:2px 8px;border-radius:8px;background:var(--chip);color:var(--pri-dark);margin-top:4px}
.sum div{display:flex;justify-content:space-between;padding:5px 0}
.sum .tot{border-top:1px solid var(--line);margin-top:6px;padding-top:10px;font-weight:800;font-size:18px;color:var(--pri-dark)}
footer{padding:12px 14px;background:var(--card);border-top:1px solid var(--line);box-shadow:0 -2px 10px rgba(13,60,100,.05)}
input.f{width:100%;padding:12px;border-radius:12px;border:1px solid var(--line);background:var(--bg);margin-top:6px}
input.f:focus{outline:none;border-color:var(--pri)}
.pay{border:2px solid var(--pri);border-radius:14px;padding:14px;display:flex;gap:10px;align-items:center;background:var(--pri-soft)}
.dot{width:20px;height:20px;border-radius:50%;border:6px solid var(--pri);flex:none;background:#fff}
.ok{width:76px;height:76px;border-radius:50%;background:var(--good-bg);color:var(--good);display:grid;place-items:center;font-size:40px;margin:10px auto;border:3px solid #fff;box-shadow:0 4px 14px rgba(21,138,92,.25)}
.step{display:flex;gap:12px;padding-bottom:22px;position:relative}
.step i{width:26px;height:26px;border-radius:50%;flex:none;display:grid;place-items:center;font-style:normal;font-size:14px;border:2px solid var(--line);background:var(--card);z-index:1;color:var(--mute)}
.step.d i{background:var(--pri);border-color:var(--pri);color:var(--pri-ink)}
.step:not(:last-child)::after{content:"";position:absolute;inset-inline-start:12px;top:26px;bottom:0;width:2px;background:var(--line)}
.step.d:not(:last-child)::after{background:var(--pri)}
.empty{text-align:center;color:var(--mute);padding:40px 10px}
.spec{font-size:14px;color:var(--mute);line-height:1.8}
</style>
</head>
<body>
<div class="app" id="app"></div>
<script>
const CATS=["الوقاية والتعقيم","المخدر والمحاقن","المواد الترميمية","المواد الطابعة والأسمنت","معالجة الجذور والجراحة"];
// [cat, title, brand, unit, base price]
const P=[
[0,"كفوف نتريل غير مبودرة","Ansell","علبة 100 كفوف",9],
[0,"كمامات طبية 3 طبقات","Medicom","علبة 50 كمامة",4],
[0,"محلول تعقيم الأسطح","Metrex CaviCide","عبوة 1 لتر",14],
[0,"أكياس تعقيم ذاتية اللصق","Crosstex","علبة 200 كيس",12],
[0,"مرايل مرضى ورقية","Dochem","علبة 500 قطعة",15],
[0,"محلول شطف وتعقيم الأدوات","Dentsply Cidex","عبوة 5 لتر",38],
[1,"أرتيكائين 4% مع أدرينالين","Septodont Septanest","علبة 50 كبسولة",28],
[1,"ليدوكائين 2% مع أدرينالين","Novocol Lignospan","علبة 50 كبسولة",24],
[1,"إبر تخدير قصيرة 27G","Septodont","علبة 100 إبرة",8],
[1,"إبر تخدير طويلة 30G","Terumo","علبة 100 إبرة",9],
[1,"محقنة كاربول معدنية","Dentsply Aspirating","قطعة",12],
[1,"جل مخدر موضعي","Pascal Benzocaine","عبوة 30 غ",6],
[2,"كومبوزيت نانو Filtek Z250","3M ESPE","حقنة 4 غ",26],
[2,"كومبوزيت Tetric N-Ceram","Ivoclar Vivadent","حقنة 3 غ",29],
[2,"لاصق Adper Single Bond","3M ESPE","عبوة 6 مل",48],
[2,"زجاج أيونومر Fuji IX","GC","علبة كبسولات 50",72],
[2,"قاعدة هيدروكسيد الكالسيوم Dycal","Dentsply","علبة",18],
[2,"كومبوزيت سائل Flowable","3M ESPE Filtek Supreme","حقنة 2 غ",22],
[3,"ألجينات Tropicalgin","Zhermack","كيس 500 غ",11],
[3,"سيليكون طبعة Putty","Dentsply Aquasil","علبة 2×300 مل",46],
[3,"سيليكون طبعة Elite HD+","Zhermack","علبة 2×50 مل",39],
[3,"أسمنت زجاجي Ketac Cem","3M ESPE","علبة",44],
[3,"أسمنت مؤقت TempBond","Kerr","أنبوبان",21],
[3,"أسمنت زجاجي Fuji I","GC","علبة",35],
[4,"مبارد جذور K-Files 25 مم","Dentsply Maillefer","علبة 6 مبارد",7],
[4,"غوتابيركا مخروطية","Meta Biomed","علبة 100",8],
[4,"هيبوكلوريت الصوديوم 5.25%","Prevest","عبوة 500 مل",5],
[4,"معجون حشو أقنية AH Plus","Dentsply","علبة",43],
[4,"خيوط جراحية حريرية 4/0","Ethicon","علبة 12",19],
[4,"شفرات مشرط جراحي رقم 15","Swann-Morton","علبة 100",13]
];
const D=[["اللواج",1],["الشرق",.96],["إدوارد",1.06]];
const prods=P.map((p,i)=>({id:i,cat:p[0],title:p[1],brand:p[2],unit:p[3],offers:D.map((d,j)=>{
 const m=[1,.96,1.06][(i+j)%3];const s=(i+j)%7===0?0:((i+j)%4===0?1:2);
 return{d:d[0],price:Math.round(p[4]*m*100)/100,stock:s}})}));
const ST=["غير متوفر","كمية محدودة","متوفر"],SC=["var(--bad)","var(--warn)","var(--good)"];
const $=n=>"$"+n.toFixed(2);
const S={screen:"home",q:"",cat:-1,pid:null,cart:[]};
const min=p=>Math.min(...p.offers.filter(o=>o.stock>0).map(o=>o.price));
const cnt=()=>S.cart.reduce((a,c)=>a+c.qty,0);
function go(s,pid){S.screen=s;if(pid!==undefined)S.pid=pid;render()}
function add(pid,d){const o=prods[pid].offers.find(o=>o.d===d);const c=S.cart.find(c=>c.pid===pid&&c.d===d);
 c?c.qty++:S.cart.push({pid,d,qty:1,price:o.price});render(true)}
function chg(i,n){S.cart[i].qty+=n;if(S.cart[i].qty<1)S.cart.splice(i,1);render()}
const sub=()=>S.cart.reduce((a,c)=>a+c.qty*c.price,0);
const fee=()=>new Set(S.cart.map(c=>c.d)).size*3;
function hdr(title,back){return`<header>${back?`<button class="ib" onclick="go('${back}')" aria-label="رجوع">→</button>`:`<span class="logo">🦷</span>`}<h1>${title}</h1>${S.screen==="cart"||S.screen==="checkout"||S.screen==="done"?"":`<button class="ib" onclick="go('cart')" aria-label="السلة">🛒${cnt()?`<span class="cnt">${cnt()}</span>`:""}</button>`}</header>`}
function renderList(){const q=S.q.trim();
 return prods.filter(p=>(S.cat<0||p.cat===S.cat)&&(!q||(p.title+p.brand).toLowerCase().includes(q.toLowerCase()))).map(p=>`
 <button class="card prod" onclick="go('detail',${p.id})"><div class="th">${p.brand[0]}</div>
 <div><div class="t">${p.title}</div><span class="tag" dir="ltr">${p.brand}</span><div class="unit">${p.unit}</div></div></button>`).join("")||'<div class="empty">لا توجد نتائج مطابقة</div>'}
function render(keep){const a=document.getElementById("app");let h="";const y=keep?(document.querySelector("main")||{}).scrollTop:0;
 if(S.screen==="home"){h=hdr("مستلزمات العيادة")+`<main><input class="search" id="q" type="search" enterkeyhint="search" placeholder="ابحث عن أدوات أو مواد أسنان..." value="${S.q}" >
 <div class="chips"><button class="chip ${S.cat<0?"on":""}" onclick="S.cat=-1;render()">الكل</button>${CATS.map((c,i)=>`<button class="chip ${S.cat===i?"on":""}" onclick="S.cat=${i};render()">${c}</button>`).join("")}</div><div id="l">${renderList()}</div></main>`}
 else if(S.screen==="detail"){const p=prods[S.pid],lo=min(p);
 h=hdr("مقارنة الأسعار","home")+`<main><div class="card"><div class="th" style="width:100%;height:120px;font-size:44px">${p.brand[0]}</div>
 <div class="t" style="font-size:18px;margin-top:10px">${p.title}</div><div class="spec"><span dir="ltr">${p.brand}</span><br>التعبئة: ${p.unit}<br>السعر بالدولار الأمريكي لكل وحدة تعبئة</div></div>
 ${p.offers.map(o=>`<div class="card"><div class="offer"><span class="n">${o.d}</span>${o.price===lo&&o.stock>0?'<span class="badge">الأقل سعراً</span>':""}</div>
 <div class="offer" style="margin-top:8px"><span class="px">${$(o.price)}</span><span class="stk" style="color:${SC[o.stock]};flex:1">● ${ST[o.stock]}</span>
 <button class="btn" ${o.stock?"":"disabled"} onclick="add(${p.id},'${o.d}')">إضافة للسلة</button></div></div>`).join("")}</main>`}
 else if(S.screen==="cart"){
 h=hdr("سلة المشتريات الموحدة","home")+(S.cart.length?`<main>${S.cart.map((c,i)=>{const p=prods[c.pid];return`<div class="card"><div class="row"><div class="th">${p.brand[0]}</div><div style="flex:1"><div class="t">${p.title}</div><span class="dist">المورد: ${c.d}</span></div></div>
 <div class="offer" style="margin-top:10px"><div class="qty"><button onclick="chg(${i},-1)">−</button><b>${c.qty}</b><button onclick="chg(${i},1)">+</button></div><span class="px" style="margin-inline-start:auto">${$(c.price*c.qty)}</span></div></div>`}).join("")}
 <div class="card sum"><div><span>المجموع الفرعي</span><span>${$(sub())}</span></div><div><span>رسوم التوصيل</span><span>${$(fee())}</span></div><div class="tot"><span>الإجمالي</span><span>${$(sub()+fee())}</span></div></div></main><footer><button class="btn big" onclick="go('checkout')">متابعة الشراء</button></footer>`
 :'<main><div class="empty">السلة فارغة<br><br><button class="btn" onclick="go(\'home\')">تصفح المنتجات</button></div></main>')}
 else if(S.screen==="checkout"){
 h=hdr("إتمام الطلب","cart")+`<main><div class="card"><b>عنوان العيادة</b><input class="f" value="عيادة د. سامر – عمّان، الدوار السابع، مبنى 12، الطابق 2"></div>
 <div class="card"><b>طريقة الدفع</b><div class="pay" style="margin-top:8px"><div class="dot"></div><b>الدفع عند الاستلام (Cash on Delivery)</b></div></div>
 <div class="card sum"><div class="tot" style="border:0;margin:0;padding:0"><span>الإجمالي</span><span>${$(sub()+fee())}</span></div></div></main><footer><button class="btn big" onclick="go('done')">تأكيد الطلب</button></footer>`}
 else{const st=[["تم استلام الطلب بواسطة الموردين",1],["جاري تجهيز الشحنة والتغليف",1],["السائق في الطريق إلى العيادة",0]];
 h=hdr("تأكيد الطلب والمتابعة")+`<main><div class="ok">✓</div><h2 style="text-align:center;margin:0 0 20px">تم استلام طلبك بنجاح</h2>
 <div class="card">${st.map(s=>`<div class="step ${s[1]?"d":""}"><i>${s[1]?"✓":""}</i><span style="padding-top:2px;${s[1]?"":"color:var(--mute)"}">${s[0]}</span></div>`).join("")}</div></main><footer><button class="btn sec big" onclick="S.cart=[];S.q='';S.cat=-1;go('home')">طلب جديد</button></footer>`}
 a.innerHTML=h;const qi=document.getElementById("q");if(qi){const up=()=>{S.q=qi.value;document.getElementById("l").innerHTML=renderList()};qi.addEventListener("input",up);qi.addEventListener("search",up);qi.addEventListener("keydown",e=>{if(e.key==="Enter"){up();qi.blur()}})}const m=a.querySelector("main");if(m&&y)m.scrollTop=y}
render();
</script>
</body>
</html>
