<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>مستلزمات الأسنان</title>
<meta name="description" content="تطبيق طلب مستلزمات الأسنان – قارن الأسعار بين الموردين وأضف للسلة بسهولة">
<meta name="theme-color" content="#2563EB">
<link rel="icon" href="assets/icon-192.png" type="image/png">
<link href="https://fonts.googleapis.com/css2?family=Cairo:wght@400;500;600;700;800&display=swap" rel="stylesheet">
<link rel="manifest" href="manifest.json">
<style>
/* ─── Design Tokens ─── */
:root {
  /* Primary */
  --pri:        #2563EB;
  --pri-dark:   #1D4ED8;
  --pri-light:  #3B82F6;
  --pri-soft:   #EFF6FF;
  --pri-border: #BFDBFE;
  --pri-ink:    #ffffff;

  /* Neutrals */
  --ink:        #111827;
  --ink-sub:    #374151;
  --mute:       #6B7280;
  --mute-light: #9CA3AF;
  --line:       #E5E7EB;
  --bg:         #F3F4F6;
  --bg-white:   #ffffff;

  /* Status */
  --good:       #10B981;
  --good-bg:    #ECFDF5;
  --warn:       #F59E0B;
  --warn-bg:    #FFFBEB;
  --bad:        #EF4444;
  --bad-bg:     #FEF2F2;

  /* Misc */
  --radius-sm:  8px;
  --radius-md:  12px;
  --radius-lg:  16px;
  --shadow-sm:  0 1px 3px rgba(0,0,0,.06), 0 1px 2px rgba(0,0,0,.04);
  --shadow-md:  0 2px 10px rgba(15,23,42,.05), 0 1px 3px rgba(15,23,42,.03);
  --shadow-lg:  0 4px 16px rgba(15,23,42,.08);

  color-scheme: light;
  box-sizing: border-box;
}
*, *::before, *::after { box-sizing: border-box; }
html, body { height: 100%; margin: 0; }

body {
  background: var(--bg);
  color: var(--ink);
  font-family: 'Cairo', 'Segoe UI', Tahoma, sans-serif;
  font-size: 15px;
  line-height: 1.5;
  -webkit-font-smoothing: antialiased;
}
button, input { font: inherit; color: inherit; }
button { cursor: pointer; border: none; background: none; padding: 0; }

/* ─── App Shell ─── */
.app {
  max-width: 430px;
  min-height: 100vh;
  margin: 0 auto;
  display: flex;
  flex-direction: column;
  background: var(--bg-white);
  position: relative;
}
@media (min-width: 500px) {
  .app {
    border-inline: 1px solid var(--line);
    box-shadow: 0 0 40px rgba(37,99,235,.08);
    min-height: 100vh;
  }
}

/* ─── Header ─── */
.hdr {
  display: flex;
  align-items: center;
  gap: 8px;
  padding: 0 16px;
  height: 54px;
  background: var(--bg-white);
  border-bottom: 1px solid var(--line);
  position: sticky;
  top: 0;
  z-index: 10;
}
.hdr-title {
  flex: 1;
  font-size: 18px;
  font-weight: 700;
  color: var(--ink);
  text-align: center;
}
.hdr-logo {
  width: 32px;
  height: 32px;
  border-radius: 10px;
  background: var(--pri-soft);
  display: grid;
  place-items: center;
  font-size: 16px;
  flex: none;
  color: var(--pri);
}
.hdr-btn {
  width: 36px;
  height: 36px;
  border-radius: var(--radius-sm);
  background: var(--bg);
  display: grid;
  place-items: center;
  flex: none;
  position: relative;
  transition: background .15s;
}
.hdr-btn:hover { background: var(--line); }
.hdr-btn svg { display: block; }
.cart-badge {
  position: absolute;
  top: -4px;
  inset-inline-start: -4px;
  background: var(--bad);
  color: #fff;
  border-radius: 10px;
  min-width: 18px;
  height: 18px;
  font-size: 11px;
  font-weight: 700;
  display: grid;
  place-items: center;
  border: 2px solid var(--bg-white);
  padding: 0 3px;
}
.hdr-spacer { width: 36px; flex: none; }

/* ─── Main scroll area ─── */
main {
  flex: 1;
  overflow-y: auto;
  padding: 16px;
  padding-bottom: calc(72px + env(safe-area-inset-bottom, 0px));
}

/* ─── Bottom Navigation ─── */
.nav {
  position: sticky;
  bottom: 0;
  background: var(--bg-white);
  border-top: 1px solid var(--line);
  display: flex;
  padding-bottom: env(safe-area-inset-bottom, 0px);
  z-index: 10;
}
.nav-item {
  flex: 1;
  display: flex;
  flex-direction: column;
  align-items: center;
  gap: 4px;
  padding: 10px 0;
  font-size: 11px;
  font-weight: 600;
  color: var(--mute);
  position: relative;
  transition: color .15s;
}
.nav-item.active { color: var(--pri); }
.nav-item svg { display: block; }
.nav-badge {
  position: absolute;
  top: 6px;
  inset-inline-start: calc(50% + 6px);
  background: var(--bad);
  color: #fff;
  border-radius: 10px;
  min-width: 16px;
  height: 16px;
  font-size: 10px;
  font-weight: 700;
  display: grid;
  place-items: center;
  border: 2px solid var(--bg-white);
  padding: 0 2px;
}

/* ─── Search ─── */
.search-wrap {
  position: relative;
  margin-bottom: 14px;
}
.search-icon {
  position: absolute;
  inset-inline-end: 12px;
  top: 50%;
  transform: translateY(-50%);
  color: var(--mute);
  pointer-events: none;
  display: flex;
}
.search {
  width: 100%;
  padding: 11px 40px 11px 14px;
  border-radius: var(--radius-md);
  border: 1.5px solid var(--line);
  background: var(--bg);
  font-size: 14px;
  color: var(--ink);
  transition: border-color .15s, box-shadow .15s;
}
.search::placeholder { color: var(--mute-light); }
.search:focus {
  outline: none;
  border-color: var(--pri);
  background: var(--bg-white);
  box-shadow: 0 0 0 3px var(--pri-soft);
}

/* ─── Category chips ─── */
.chips {
  display: flex;
  gap: 8px;
  overflow-x: auto;
  padding-bottom: 14px;
  scrollbar-width: none;
}
.chips::-webkit-scrollbar { display: none; }
.chip {
  white-space: nowrap;
  padding: 7px 14px;
  border-radius: 999px;
  border: 1.5px solid var(--line);
  background: var(--bg-white);
  color: var(--ink-sub);
  font-size: 13px;
  font-weight: 600;
  flex: none;
  transition: all .15s;
}
.chip.on {
  background: var(--pri);
  color: #fff;
  border-color: var(--pri);
  box-shadow: 0 2px 8px rgba(37,99,235,.3);
}
.chip:hover:not(.on) {
  border-color: var(--pri-border);
  background: var(--pri-soft);
}

/* ─── Product Card (Home list) ───
   Matches the card spec in "Dental Supplies design html/home.html" */
.prod-card {
  position: relative;
  display: flex;
  flex-direction: column;
  align-items: stretch;
  justify-content: flex-start;
  gap: 0;
  width: 100%;
  min-width: 0;
  padding: 0;
  margin: 0;
  overflow: hidden;
  text-align: right;
  background: var(--bg-white);
  border: 0;
  outline: 1px solid #E5E7EB;
  outline-offset: -1px;
  border-radius: 12px;
  box-shadow: 0 4px 12px rgba(0, 0, 0, .02);
  transition: box-shadow .15s ease;
  cursor: pointer;
}
.prod-card:hover { box-shadow: 0 6px 16px rgba(37, 99, 235, .10); }
.prod-card:active { opacity: .9; }
/* keep the 1px card edge visible while still showing a focus ring */
.prod-card:focus-visible {
  outline-color: var(--pri);
  box-shadow: 0 0 0 3px rgba(37, 99, 235, .25);
}

/* Product image strip */
.prod-icon {
  align-self: stretch;
  width: 100%;
  height: 110px;
  flex: none;
  border-radius: 0;
  background: #EFF6FF;
  display: block;
  overflow: hidden;
}

/* Everything under the image: 12px padding, 8px rhythm */
.prod-body {
  position: relative;
  align-self: stretch;
  display: flex;
  flex-direction: column;
  align-items: flex-start;
  justify-content: flex-start;
  gap: 8px;
  padding: 12px;
  min-width: 0;
}

.prod-name {
  align-self: stretch;
  text-align: right;
  color: #1F2937;
  font-size: 15px;
  font-weight: 700;
  line-height: 1.45;
  white-space: normal;
  overflow: hidden;
  display: -webkit-box;
  -webkit-line-clamp: 2;
  -webkit-box-orient: vertical;
  min-height: 43px;
}
.prod-brand { display: none; }

/* "150 ل.س  يبدأ من" — price first, label to its right */
.prod-price-col {
  align-self: stretch;
  display: flex;
  flex-direction: row;
  justify-content: flex-end;
  align-items: baseline;
  gap: 4px;
  direction: ltr;
  padding: 0;
  margin: 0;
  border: 0;
  text-align: right;
}
.prod-from-price {
  display: inline;
  direction: ltr;
  color: var(--pri);
  font-size: 15px;
  font-weight: 800;
}
.prod-from-label {
  display: inline;
  color: #4B5563;
  font-size: 12px;
  font-weight: 400;
}

/* Hairline rule under the price */
.prod-divider {
  align-self: stretch;
  height: 0;
  border-top: 1px solid #F3F4F6;
}

/* "6 موزعين" chip floating over the bottom-left of the image */
.dist-count {
  position: absolute;
  left: 12px;
  top: -30px;
  display: inline-flex;
  justify-content: center;
  align-items: center;
  padding: 4px 8px;
  border-radius: 6px;
  background: #EFF6FF;
  color: var(--pri);
  font-size: 11px;
  font-weight: 700;
  white-space: nowrap;
}
.dist-count svg { display: none; }

/* "متوفر الآن" with its status dot */
.prod-meta {
  align-self: stretch;
  display: flex;
  /* page is RTL, so flex-start resolves to the right edge (design: flex-end in LTR) */
  justify-content: flex-start;
  align-items: center;
  gap: 4px;
  margin: 0;
  min-height: 17px;
}
.avail-badge {
  display: inline-flex;
  flex-direction: row-reverse;
  align-items: center;
  gap: 4px;
  padding: 0;
  background: transparent;
  border-radius: 0;
  font-size: 11px;
  font-weight: 600;
}
.avail-badge::before {
  content: "";
  width: 6px;
  height: 6px;
  border-radius: 3px;
  background: currentColor;
  flex: none;
}
.avail-badge.good { color: var(--good); }
.avail-badge.warn { color: var(--warn); }
.avail-badge.bad  { color: var(--bad);  }

/* ─── Empty state ─── */
.empty {
  text-align: center;
  color: var(--mute);
  padding: 50px 20px;
}
.empty-icon {
  font-size: 48px;
  margin-bottom: 12px;
}
.empty p { margin: 0 0 16px; font-size: 15px; }

/* ─── Card container (general) ─── */
.card {
  background: var(--bg-white);
  border: 1px solid var(--line);
  border-radius: var(--radius-md);
  padding: 14px;
  margin-bottom: 12px;
  box-shadow: var(--shadow-md);
}
.card-title {
  font-size: 13px;
  font-weight: 700;
  color: var(--ink);
  margin-bottom: 10px;
  display: flex;
  align-items: center;
  gap: 6px;
}

/* ─── Buttons ─── */
.btn {
  border-radius: var(--radius-sm);
  background: var(--pri);
  color: #fff;
  padding: 10px 16px;
  font-size: 14px;
  font-weight: 700;
  display: inline-flex;
  align-items: center;
  justify-content: center;
  gap: 6px;
  transition: background .15s, transform .08s, box-shadow .15s;
  box-shadow: 0 2px 8px rgba(37,99,235,.25);
  min-height: 42px;
}
.btn:hover { background: var(--pri-dark); }
.btn:active { transform: scale(.97); }
.btn:disabled { opacity: .45; cursor: not-allowed; box-shadow: none; transform: none; }
.btn.outline {
  background: var(--bg-white);
  color: var(--pri);
  border: 1.5px solid var(--pri);
  box-shadow: none;
}
.btn.outline:hover { background: var(--pri-soft); }
.btn.ghost {
  background: var(--bg);
  color: var(--ink-sub);
  box-shadow: none;
}
.btn.ghost:hover { background: var(--line); }
.btn.full { width: 100%; padding: 14px; font-size: 16px; border-radius: var(--radius-md); }
.btn.success-ghost {
  background: var(--bg);
  color: var(--ink-sub);
  box-shadow: none;
  border: 1.5px solid var(--line);
}

/* ─── Footer action bar ─── */
.footer-bar {
  padding: 12px 16px;
  padding-bottom: calc(12px + env(safe-area-inset-bottom, 0px));
  background: var(--bg-white);
  border-top: 1px solid var(--line);
}

/* ─── Detail screen ───
   Matches "Dental Supplies design html/product-details.html" */
.hdr.detail-hdr { border-bottom: 1px solid #E2E8F0; }
.detail-hdr .hdr-title { color: #0F172A; font-size: 20px; font-weight: 700; }
.detail-hdr .hdr-btn {
  width: 40px;
  height: 40px;
  background: #F3F4F6;
  border-radius: 8px;
  color: #0F172A;
}
.detail-hdr .hdr-btn:hover { background: #E5E7EB; }
.detail-hdr .hdr-share {
  width: 32px;
  height: 32px;
  background: #F3F4F6;
  border-radius: 8px;
  color: #111827;
}
.detail-main {
  padding: 16px 16px 24px;
  display: flex;
  flex-direction: column;
  align-items: flex-start;
  gap: 20px;
}

/* Framed product image */
.detail-hero {
  align-self: stretch;
  height: 240px;
  padding: 16px;
  margin: 0;
  background: #fff;
  border: 0;
  outline: 1px solid #E2E8F0;
  outline-offset: -1px;
  border-radius: 12px;
  box-shadow: none;
  display: flex;
  justify-content: center;
  align-items: center;
}
.detail-hero-icon {
  flex: 1 1 0;
  align-self: stretch;
  width: auto;
  height: auto;
  margin: 0;
  border-radius: 8px;
  overflow: hidden;
  background: transparent;
}
.detail-hero-icon img { border-radius: 8px; }

/* Title block: category pill + name, then the spec line */
.detail-head {
  align-self: stretch;
  display: flex;
  flex-direction: column;
  align-items: flex-start;
  gap: 10px;
}
.detail-title-row {
  display: inline-flex;
  flex-direction: row;
  align-items: center;
  gap: 8px;
}
.detail-cat-pill {
  padding: 4px 10px;
  background: #EFF6FF;
  border-radius: 100px;
  color: var(--pri);
  font-size: 12px;
  font-weight: 600;
  white-space: nowrap;
}
.detail-hero-name {
  margin: 0;
  text-align: right;
  color: #0F172A;
  font-size: 22px;
  font-weight: 700;
}
.detail-hero-spec {
  align-self: stretch;
  margin: 0;
  text-align: right;
  color: #475569;
  font-size: 14px;
  font-weight: 400;
  line-height: 22.4px;
}

.detail-rule {
  align-self: stretch;
  height: 0;
  border-top: 1px solid #E2E8F0;
}

/* "قارن السعر بين الموزعين" */
.detail-section {
  align-self: stretch;
  display: flex;
  flex-direction: column;
  align-items: flex-start;
  gap: 12px;
}
.detail-section-title {
  margin: 0;
  text-align: right;
  color: #0F172A;
  font-size: 16px;
  font-weight: 700;
}
.offer-list {
  align-self: stretch;
  display: flex;
  flex-direction: column;
  align-items: flex-start;
  gap: 10px;
}

/* Selectable distributor row */
.offer-card {
  align-self: stretch;
  width: 100%;
  display: flex;
  flex-direction: row;
  align-items: center;
  gap: 12px;
  padding: 14px;
  margin: 0;
  text-align: right;
  background: #fff;
  border: 0;
  outline: 1px solid #E2E8F0;
  outline-offset: -1px;
  border-radius: 12px;
  box-shadow: 0 2px 8px rgba(15, 23, 42, .03);
  cursor: pointer;
  transition: outline-color .15s, background .15s;
}
.offer-card.sel {
  background: #ECFDF5;
  outline-color: #10B981;
  box-shadow: none;
}
.offer-card[disabled] { opacity: .55; cursor: not-allowed; }
.offer-card:focus-visible {
  outline-color: var(--pri);
  box-shadow: 0 0 0 3px rgba(37, 99, 235, .25);
}

/* right side: distributor name + rating */
.offer-main {
  display: inline-flex;
  flex-direction: column;
  align-items: flex-start;
  gap: 6px;
}
.offer-header {
  display: inline-flex;
  flex-direction: row;
  align-items: center;
  gap: 8px;
  margin: 0;
}
.offer-name {
  text-align: right;
  color: #0F172A;
  font-size: 14px;
  font-weight: 700;
}
.best-badge {
  padding: 4px 10px;
  border-radius: 100px;
  background: #ECFDF5;
  color: var(--good);
  font-size: 12px;
  font-weight: 600;
  white-space: nowrap;
}
.offer-rating {
  display: inline-flex;
  flex-direction: row-reverse;
  align-items: center;
  gap: 4px;
  color: #475569;
  font-size: 12px;
  font-weight: 600;
}
.offer-rating svg { flex: none; }

.offer-spacer { flex: 1 1 0; height: 1px; }

/* left side: radio, price, ETA */
.offer-aside {
  display: inline-flex;
  flex-direction: column;
  /* the ETA line is the widest child; flex-end is the LEFT edge under
     dir="rtl", so the radio and price sit flush left beneath it */
  align-items: flex-end;
  gap: 8px;
}
.offer-radio { display: flex; align-items: center; }
.offer-price {
  direction: ltr;
  color: var(--pri);
  font-size: 16px;
  font-weight: 700;
}
.offer-eta {
  display: inline-flex;
  align-items: center;
  gap: 4px;
  color: #475569;
  font-size: 11px;
  font-weight: 400;
  white-space: nowrap;
}
.offer-eta svg { flex: none; }
.offer-stk {
  font-size: 11px;
  font-weight: 600;
}
.offer-stk.good { color: var(--good); }
.offer-stk.warn { color: var(--warn); }
.offer-stk.bad  { color: var(--bad);  }

/* Sticky purchase bar */
.detail-bar {
  position: sticky;
  bottom: 0;
  z-index: 5;
  padding: 16px 20px 32px;
  background: #fff;
  border-top: 1px solid #E2E8F0;
  box-shadow: 0 -4px 16px rgba(15, 23, 42, .03);
  display: flex;
  flex-direction: column;
  align-items: flex-start;
  gap: 16px;
}
.detail-bar-row {
  align-self: stretch;
  display: flex;
  flex-direction: row-reverse;
  justify-content: space-between;
  align-items: center;
  padding-inline: 16px 8px;
}
.detail-total {
  direction: ltr;
  text-align: right;
  color: rgba(15, 23, 42, .90);
  font-size: 32px;
  font-weight: 700;
  line-height: 1.1;
}
.detail-bar .qty-ctrl {
  height: 60px;
  padding: 6px;
  display: flex;
  flex-direction: row-reverse;
  justify-content: space-between;
  align-items: center;
  gap: 0;
  background: #fff;
  border: 0;
  outline: 1px solid #E2E8F0;
  outline-offset: -1px;
  border-radius: 100px;
  overflow: visible;
}
.detail-bar .qty-btn {
  width: 48px;
  align-self: stretch;
  height: auto;
  display: grid;
  place-items: center;
  background: #EFF6FF;
  color: var(--pri);
  border-radius: 999px;
  font-size: 20px;
  font-weight: 700;
  transition: background .15s;
  flex: none;
}
.detail-bar .qty-btn.minus, .detail-bar .qty-btn.plus { background: #EFF6FF; color: var(--pri); }
.detail-bar .qty-btn:hover.minus, .detail-bar .qty-btn:hover.plus { background: #DBEAFE; }
.detail-bar .qty-btn[disabled] { opacity: .45; cursor: not-allowed; }
.detail-bar .qty-num {
  width: 48px;
  text-align: center;
  color: #0F172A;
  font-size: 24px;
  font-weight: 700;
}
.detail-add {
  align-self: stretch;
  width: 100%;
  height: 48px;
  display: inline-flex;
  flex-direction: row-reverse;
  justify-content: center;
  align-items: center;
  gap: 8px;
  background: var(--pri);
  color: #fff;
  border-radius: 12px;
  box-shadow: 0 4px 12px rgba(37, 99, 235, .20);
  font-size: 16px;
  font-weight: 700;
}
.detail-add[disabled] {
  background: #CBD5E1;
  box-shadow: none;
  cursor: not-allowed;
}
.detail-add.done { background: var(--good); box-shadow: 0 4px 12px rgba(16, 185, 129, .20); }

/* ─── Cart ─── */
.cart-item {
  background: var(--bg-white);
  border: 1px solid var(--line);
  border-radius: var(--radius-md);
  padding: 12px;
  margin-bottom: 10px;
  box-shadow: var(--shadow-md);
}
.cart-item-head {
  display: flex;
  gap: 10px;
  align-items: flex-start;
  margin-bottom: 10px;
}
.cart-icon {
  width: 52px;
  height: 52px;
  border-radius: 10px;
  background: var(--pri-soft);
  display: grid;
  place-items: center;
  font-weight: 800;
  font-size: 20px;
  color: var(--pri);
  flex: none;
}

  font-size: 14px;
  font-weight: 700;

  font-weight: 800;

  border: none;

}
.summary-total {
  display: flex;
  justify-content: space-between;
  align-items: center;
  padding-top: 6px;
  font-size: 16px;
  font-weight: 800;
}
.summary-total .val { color: var(--pri); direction: ltr; }

  font-size: 13px;
  font-weight: 700;
  color: var(--ink);
  margin-bottom: 6px;
  display: flex;
  align-items: center;
  gap: 6px;
}
.form-input {
  width: 100%;
  padding: 11px 12px;
  border-radius: var(--radius-sm);
  border: 1.5px solid var(--line);

  font-size: 14px;
  color: var(--ink);

  place-items: center;
}

  width: 10px;
  height: 10px;
  border-radius: 50%;

.pay-name {
  font-size: 14px;
  font-weight: 700;
  color: var(--ink);
}
.pay-desc {

}

  height: 80px;

  font-size: 20px;
  font-weight: 800;

.timeline { position: relative; }

.tl-col {
  display: flex;
  flex-direction: column;
  align-items: center;
  flex: none;
  width: 30px;
}
.tl-dot {
  width: 30px;
  height: 30px;
  border-radius: 50%;
  display: grid;
  place-items: center;
  flex: none;
  z-index: 1;

  font-weight: 700;
}
.tl-dot.done {
  background: var(--good);

.tl-dot.active {
  background: var(--pri);

}
.tl-dot.pending {
  background: var(--bg);
  color: var(--mute);
  border: 2px solid var(--line);
}

  width: 2px;
  flex: 1;
  min-height: 28px;
  margin: 2px 0;
  border-radius: 1px;
}
.tl-line.done  { background: var(--good); }
.tl-line.pending { background: var(--line); }

  flex: 1;
  padding-top: 4px;
  padding-bottom: 20px;
}

  font-size: 14px;
  font-weight: 700;
  color: var(--ink);
  line-height: 1.4;

/* ─── MVP visual language from the design screens ─── */
:root {
  --ink: #1F2937;

  --line: #E5E7EB;
  --bg: #F8FAFC;
  --pri: #2563EB;
  --pri-soft: #EFF6FF;
  --pri-border: #BFDBFE;
  --radius-sm: 8px;
  --radius-md: 12px;
  --radius-lg: 16px;
  --shadow-md: 0 4px 12px rgba(0,0,0,.04);
}
body { background: #eef2f7; font-family: 'Cairo', Tahoma, sans-serif; }
.app { max-width: 402px; background: var(--bg); box-shadow: 0 0 35px rgba(15,23,42,.08); }
.hdr { height: 66px; padding: 0 24px; border-bottom: 0; }
.hdr-title { color: var(--pri); font-size: 20px; font-weight: 700; }
.hdr-logo { width: 32px; height: 32px; border-radius: 10px; overflow: hidden; background: var(--pri); }
.hdr-logo img { width: 100%; height: 100%; object-fit: cover; }
.hdr-btn { width: 40px; height: 40px; border-radius: 50%; background: #F3F4F6; }
main { padding: 10px 24px 18px; background: var(--bg); }
.search-wrap { margin: 0 0 16px; }
.search { padding: 12px 42px 12px 14px; border: 0; border-radius: 10px; background: #F3F4F6; box-shadow: none; }
.search:focus { background: #fff; }
.chips { gap: 8px; padding: 0 0 20px; }
.chip { padding: 7px 13px; border: 0; background: #F3F4F6; color: var(--ink-sub); border-radius: 7px; font-size: 12px; font-weight: 600; }
.chip.on { background: var(--pri); box-shadow: none; }
#l { display: grid; grid-template-columns: repeat(2, minmax(0, 1fr)); gap: 14px; }
.nav { height: 68px; padding: 10px 24px 0; border-top: 1px solid var(--line); justify-content: space-around; }
.nav-item { flex: 0 0 70px; padding: 0; gap: 4px; font-size: 11px; font-weight: 500; }
.nav-item.active { color: var(--pri); font-weight: 700; }
.nav-item svg { width: 22px; height: 22px; }
.card, .cart-item, .summary-card { box-shadow: 0 4px 12px rgba(0,0,0,.03); }
@media (min-width: 500px) { .app { border-inline: 0; } }
@media (max-width: 360px) { main { padding-inline: 16px; } .hdr { padding-inline: 16px; } #l { gap: 10px; } }

/* Small interaction and RTL polish */
.search { border-radius: 999px; }
.search-icon { inset-inline-end: auto; inset-inline-start: 12px; }
.chip { border-radius: 999px; }

/* Reference-screen details: visible controls, consistent borders and hierarchy */
.hdr-title { color: #111827; }
.hdr.home-hdr { justify-content: space-between; }
.brand-lockup { display: flex; align-items: center; gap: 8px; direction: rtl; }
.brand-lockup .hdr-logo { flex: none; }
.home-title { margin: 0; color: var(--pri); font-size: 20px; font-weight: 700; line-height: 1; }
.notification-btn { color: #1F2937; }
.search { border: 1px solid #E5E7EB; background: #F3F4F6; }
.chip { border: 1px solid #E5E7EB; background: #F3F4F6; color: #4B5563; }
.chip.on { border-color: var(--pri); background: var(--pri); color: #fff; }

/* The reference screens are phone-sized, but the live demo should use a tablet viewport well. */
@media (min-width: 600px) {
  body { background: #F8FAFC; }
  .app { width: 100%; max-width: none; min-height: 100vh; box-shadow: none; }
  .hdr { padding-inline: clamp(24px, 6vw, 72px); }
  main { padding-inline: clamp(24px, 6vw, 72px); }
  #l { grid-template-columns: repeat(3, minmax(0, 1fr)); gap: 18px; }
  .prod-icon { height: 150px; }
  .nav { padding-inline: clamp(24px, 6vw, 72px); }
}
@media (min-width: 960px) {
  #l { grid-template-columns: repeat(4, minmax(0, 1fr)); }
  .prod-icon { height: 170px; }
}

/* Tablet shell: use the complete viewport rather than the phone preview width. */
html, body { width: 100%; min-width: 100%; }
body, .app, main { background: #fff; }
@media (min-width: 431px) {
  body { background: #fff; }
  .app { width: 100%; max-width: none; margin-inline: 0; border-inline: 0; box-shadow: none; }
}

.prod-icon img { width: 100%; height: 100%; object-fit: cover; display: block; }
.detail-hero-icon img { width: 100%; height: 100%; object-fit: cover; border-radius: 8px; display: block; }
</style>

/* name, price multiplier, rating, delivery ETA — the design screen shows a

const D = [
  ["اللواج",  1,    4.8, "خلال 3 ساعات"],

const prods = P.map((p,i) => ({
  id: i, cat: p[0], title: p[1], brand: p[2], unit: p[3],
  offers: D.map((d,j) => {
    const m = [1,.96,1.06][(i+j)%3];
    const s = (i+j)%7===0 ? 0 : ((i+j)%4===0 ? 1 : 2);

}));

/* ══════════════════════════════════════════════
   CONSTANTS / HELPERS
══════════════════════════════════════════════ */
const ST  = ["غير متوفر","كمية محدودة","متوفر"];
const SCL = ["bad","warn","good"];  // CSS class suffix
const $   = n => "$" + n.toFixed(2);
const S   = { screen:"home", q:"", cat:-1, pid:null, cart:[], sel:0, qty:1, added:false };
const min = p => Math.min(...p.offers.filter(o=>o.stock>0).map(o=>o.price));
const cnt = () => S.cart.reduce((a,c) => a+c.qty, 0);
const sub = () => S.cart.reduce((a,c) => a+c.qty*c.price, 0);
const fee = () => new Set(S.cart.map(c=>c.d)).size * 3;

/* ══════════════════════════════════════════════
   NAVIGATION
══════════════════════════════════════════════ */
function go(s, pid) {
  S.screen=s;
  if(pid!==undefined) S.pid=pid;
  // entering a product: preselect the cheapest in-stock distributor, reset qty
  if (s==="detail" && S.pid!==null) { S.sel = bestOffer(prods[S.pid]); S.qty = 1; S.added = false; }
  render();
}
function add(pid, d, qty=1) {
  const o = prods[pid].offers.find(o=>o.d===d);
  const c = S.cart.find(c=>c.pid===pid && c.d===d);
  c ? c.qty += qty : S.cart.push({pid,d,qty,price:o.price});
  render(true);
}
/* index of the cheapest in-stock offer, falling back to the first one */
function bestOffer(p) {
  let bi = -1;
  p.offers.forEach((o,i) => { if (o.stock>0 && (bi<0 || o.price<p.offers[bi].price)) bi=i; });
  return bi<0 ? 0 : bi;
}
function pick(i) { S.sel = i; render(); }
function qchg(n) { S.qty = Math.min(99, Math.max(1, S.qty + n)); render(); }
function addSel() {
  const p = prods[S.pid], o = p.offers[S.sel];
  if (!o || !o.stock) return;
  add(p.id, o.d, S.qty);
  // the design has no bottom nav here, so confirm in the button itself
  S.added = true;
  clearTimeout(addSel._t);
  addSel._t = setTimeout(() => {
    S.added = false;
    if (S.screen === "detail") render(true);
  }, 1500);
}
function chg(i, n) {
  S.cart[i].qty += n;
  if (S.cart[i].qty < 1) S.cart.splice(i,1);
  render();
}

function iconTruck(size=12) {
  return `<svg width="${size}" height="${size}" viewBox="0 0 12 12" fill="none" stroke="currentColor" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
    <path d="M7.00005 8.9997V3.0003C7.00005 2.73511 6.89469 2.48078 6.70714 2.29326C6.51958 2.10574 6.26521 2.0004 5.99997 2.0004H1.99965C1.73442 2.0004 1.48004 2.10574 1.29249 2.29326C1.10494 2.48078 0.999573 2.73511 0.999573 3.0003V8.49975C0.999573 8.63234 1.05226 8.75951 1.14603 8.85327C1.23981 8.94702 1.36699 8.9997 1.49961 8.9997H2.49969M2.49969 8.9997C2.49969 9.55193 2.94744 9.9996 3.49977 9.9996C4.0521 9.9996 4.49985 9.55193 4.49985 8.9997M2.49969 8.9997C2.49969 8.44747 2.94744 7.9998 3.49977 7.9998C4.0521 7.9998 4.49985 8.44747 4.49985 8.9997M4.49985 8.9997H7.50009M7.50009 8.9997C7.50009 9.55193 7.94784 9.9996 8.50017 9.9996C9.0525 9.9996 9.50025 9.55193 9.50025 8.9997M7.50009 8.9997C7.50009 8.44747 7.94784 7.9998 8.50017 7.9998C9.0525 7.9998 9.50025 8.44747 9.50025 8.9997M9.50025 8.9997H10.5003C10.633 8.9997 10.7601 8.94702 10.8539 8.85327C10.9477 8.75951 11.0004 8.63234 11.0004 8.49975V6.67493C11.0002 6.56147 10.9614 6.45146 10.8904 6.36296L9.15022 4.18818C9.10346 4.12962 9.04413 4.08233 8.97661 4.04979C8.9091 4.01725 8.83514 4.0003 8.76019 4.0002H7.00005"/>
  </svg>`;
}
function iconStar(size=12) {
  return `<svg width="${size}" height="${size}" viewBox="0 0 24 24" fill="#F59E0B" stroke="#F59E0B" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
    <polygon points="12 2.5 15 9 22 9.8 16.8 14.4 18.3 21.3 12 17.8 5.7 21.3 7.2 14.4 2 9.8 9 9"/>
  </svg>`;
}
function iconRadio(on, dim) {
  const c = dim ? "#CBD5E1" : (on ? "#10B981" : "#94A3B8");
  return `<svg width="20" height="20" viewBox="0 0 20 20" fill="none" xmlns="http://www.w3.org/2000/svg" aria-hidden="true">
    <rect x="1" y="1" width="18" height="18" rx="9" stroke="${c}" stroke-width="2"/>
    ${on ? `<circle cx="10" cy="10" r="5" fill="#10B981"/>` : ""}
  </svg>`;
}
function iconShare(size=18) {
  return `<svg width="${size}" height="${size}" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
    <circle cx="18" cy="5" r="3"/><circle cx="6" cy="12" r="3"/><circle cx="18" cy="19" r="3"/>
    <line x1="8.6" y1="10.5" x2="15.4" y2="6.5"/><line x1="8.6" y1="13.5" x2="15.4" y2="17.5"/>
  </svg>`;
}

/* ══════════════════════════════════════════════
   SHARED PARTS
══════════════════════════════════════════════ */
function cartCount() {
  const n = cnt();
  return n ? `<span class="cart-badge" aria-label="${n} عناصر في السلة">${n}</span>` : "";
}
function navCartBadge() {
  const n = cnt();
  return n ? `<span class="nav-badge" aria-hidden="true">${n}</span>` : "";
}

function bottomNav() {
  const homeActive  = (S.screen==="home")   ? "active" : "";
  const cartActive  = (S.screen==="cart")   ? "active" : "";
  return `
  <nav class="nav" role="navigation" aria-label="التنقل الرئيسي">
    <button class="nav-item ${homeActive}" onclick="go('home')" aria-label="الرئيسية">
      ${iconHome()}
      <span>الرئيسية</span>
    </button>
    <button class="nav-item ${cartActive}" onclick="go('cart')" aria-label="السلة">
      ${iconCart()}
      ${navCartBadge()}
      <span>السلة</span>
    </button>
  </nav>`;
}

/* ══════════════════════════════════════════════
   SCREENS
══════════════════════════════════════════════ */

/* ── Home ── */
function renderList() {
  const q = S.q.trim().toLowerCase();
  const list = prods.filter(p =>
    (S.cat < 0 || p.cat === S.cat) &&
    (!q || (p.title+p.brand).toLowerCase().includes(q))
  );
  if (!list.length) return `
    <div class="empty">
      <div class="empty-icon">🔍</div>
      <p>لا توجد نتائج مطابقة</p>
    </div>`;

  return list.map(p => {
    const avail = p.offers.filter(o=>o.stock>0);
    const hasPrice = avail.length > 0;
    const loPrice = hasPrice ? min(p) : null;
    // availability label based on best available offer
    const bestStock = Math.max(...p.offers.map(o=>o.stock));
    const stClass = SCL[bestStock];
    const stLabel = ST[bestStock];
    const distCount = p.offers.length;
    return `
    <button class="prod-card" onclick="go('detail',${p.id})" aria-label="عرض تفاصيل ${p.title}">
      <div class="prod-icon"><img src="${PRODUCT_IMAGES[p.cat]}" alt="${p.title}" loading="lazy"></div>
      <div class="prod-body">
        <div class="prod-name">${p.title}</div>
        <div class="prod-price-col">
          <span class="prod-from-price">${hasPrice ? $(loPrice) : "—"}</span>
          <span class="prod-from-label">يبدأ من</span>
        </div>
        <div class="prod-divider"></div>
        <span class="dist-count">${distCount} موزعين</span>
        <div class="prod-meta">
          <span class="avail-badge ${stClass}">${stLabel}</span>
        </div>
      </div>
    </button>`;
  }).join("");
}

function screenHome() {
  return `
  <header class="hdr home-hdr" role="banner">
    <div class="brand-lockup">
      <div class="hdr-logo" aria-hidden="true"><img src="assets/icon-192.png" alt=""></div>
      <h1 class="home-title">عيادتي</h1>
    </div>
    <button class="hdr-btn notification-btn" aria-label="الإشعارات">
      <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
        <path d="M18 8a6 6 0 0 0-12 0c0 7-3 7-3 9h18c0-2-3-2-3-9"/><path d="M13.73 21a2 2 0 0 1-3.46 0"/>
        <circle cx="18.5" cy="5.5" r="2.5" fill="#EF4444" stroke="white" stroke-width="1.5"/>
      </svg>
    </button>
  </header>
  <main id="main-scroll">
    <div class="search-wrap">
      <div class="search-icon" aria-hidden="true">${iconSearch()}</div>
      <input
        class="search" id="q" type="search" enterkeyhint="search"
        placeholder="ابحث عن أدوات أو مواد أسنان..." value="${S.q}"
        aria-label="بحث عن منتجات">
    </div>
    <div class="chips" role="list" aria-label="تصفية حسب الفئة">
      <button class="chip ${S.cat<0?'on':''}" onclick="S.cat=-1;render()" role="listitem">الكل</button>
      ${CATS.map((c,i)=>`<button class="chip ${S.cat===i?'on':''}" onclick="S.cat=${i};render()" role="listitem">${c}</button>`).join("")}
    </div>
    <div id="l">${renderList()}</div>
  </main>
  ${bottomNav()}`;
}

/* ── Detail ── */
function screenDetail() {
  const p   = prods[S.pid];
  const any = p.offers.some(o=>o.stock>0);
  const lo  = any ? min(p) : null;
  const sel = p.offers[S.sel];
  const canBuy = !!(sel && sel.stock);
  return `
  <header class="hdr detail-hdr" role="banner">
    <button class="hdr-btn" onclick="go('home')" aria-label="رجوع">${iconBack()}</button>
    <h1 class="hdr-title">تفاصيل المنتج</h1>
    <button class="hdr-btn hdr-share" aria-label="مشاركة">${iconShare()}</button>
  </header>
  <main class="detail-main">
    <div class="detail-hero">
      <div class="detail-hero-icon"><img src="${PRODUCT_IMAGES[p.cat]}" alt="${p.title}"></div>
    </div>

    <div class="detail-head">
      <div class="detail-title-row">
        <h2 class="detail-hero-name">${p.title}</h2>
        <span class="detail-cat-pill">${CATS[p.cat]}</span>
      </div>
      <p class="detail-hero-spec">التعبئة: ${p.unit} — <span dir="ltr">${p.brand}</span></p>
    </div>

    <div class="detail-rule"></div>

    <section class="detail-section">
      <h3 class="detail-section-title">قارن السعر بين الموزعين</h3>
      <div class="offer-list" role="radiogroup" aria-label="قارن السعر بين الموزعين">
        ${p.offers.map((o,i) => {
          const isBest = any && o.price===lo && o.stock>0;
          const on = i===S.sel;
          return `
        <button
          class="offer-card${on?' sel':''}"
          role="radio"
          aria-checked="${on}"
          ${o.stock ? "" : "disabled"}
          onclick="pick(${i})"
          aria-label="${o.d} بسعر ${$(o.price)} ${ST[o.stock]}">
          <div class="offer-main">
            <div class="offer-header">
              <span class="offer-name">${o.d}</span>
              ${isBest ? `<span class="best-badge">الأرخص</span>` : ""}
            </div>
            <div class="offer-rating">${o.rate.toFixed(1)} ${iconStar()}</div>
          </div>
          <div class="offer-spacer"></div>
          <div class="offer-aside">
            <span class="offer-radio">${iconRadio(on, !o.stock)}</span>
            <span class="offer-price">${$(o.price)}</span>
            ${o.stock
              ? `<span class="offer-eta">${iconTruck()} ${o.eta}</span>`
              : `<span class="offer-stk bad">${ST[o.stock]}</span>`}
          </div>
        </button>`;
        }).join("")}
      </div>
    </section>
  </main>
  <div class="detail-bar">
    <div class="detail-bar-row">
      <div class="detail-total" aria-live="polite">${canBuy ? $(sel.price*S.qty) : "—"}</div>
      <div class="qty-ctrl" role="group" aria-label="الكمية">
        <button class="qty-btn minus" onclick="qchg(-1)" ${S.qty<=1?"disabled":""} aria-label="تقليل الكمية">−</button>
        <span class="qty-num" aria-live="polite">${S.qty}</span>
        <button class="qty-btn plus" onclick="qchg(1)" ${S.qty>=99?"disabled":""} aria-label="زيادة الكمية">+</button>
      </div>
    </div>
    <button class="detail-add${S.added?" done":""}" onclick="addSel()" ${canBuy?"":"disabled"}>
      ${S.added
        ? `${iconCheck(18)} تمت الإضافة`
        : `${iconCart(18)} ${canBuy ? "أضف للسلة" : "غير متوفر"}`}
    </button>
  </div>`;
}

/* ── Cart ── */
function screenCart() {
  if (!S.cart.length) {
    return `
    <header class="hdr" role="banner">
      <button class="hdr-btn" onclick="go('home')" aria-label="رجوع">${iconBack()}</button>
      <h1 class="hdr-title">سلة المشتريات</h1>
      <div class="hdr-spacer"></div>
    </header>
    <main>
      <div class="empty">
        <div class="empty-icon">🛒</div>
        <p>سلتك فارغة</p>
        <button class="btn" onclick="go('home')" aria-label="تصفح المنتجات">تصفح المنتجات</button>
      </div>
    </main>
    ${bottomNav()}`;
  }

  const items = S.cart.map((c,i) => {
    const p = prods[c.pid];
    return `
    <div class="cart-item" role="listitem">
      <div class="cart-item-head">
        <div class="cart-icon">${p.brand[0]}</div>
        <div class="cart-item-info">
          <div class="cart-item-name">${p.title}</div>
          <span class="cart-item-dist">${iconStore(11)} المورد: ${c.d}</span>
        </div>
      </div>
      <div class="cart-item-foot">
        <div class="qty-ctrl" role="group" aria-label="الكمية">
          <button class="qty-btn minus" onclick="chg(${i},-1)" aria-label="تقليل الكمية">−</button>
          <span class="qty-num" aria-live="polite">${c.qty}</span>
          <button class="qty-btn plus" onclick="chg(${i},1)" aria-label="زيادة الكمية">+</button>
        </div>
        <span class="cart-item-price">${$(c.price*c.qty)}</span>
      </div>
    </div>`;
  }).join("");

  return `
  <header class="hdr" role="banner">
    <button class="hdr-btn" onclick="go('home')" aria-label="رجوع">${iconBack()}</button>
    <h1 class="hdr-title">سلة المشتريات</h1>
    <div class="hdr-spacer"></div>
  </header>
  <main>
    <div role="list" aria-label="عناصر السلة">${items}</div>
    <div class="summary-card" aria-label="ملخص الطلب">
      <div class="summary-row">
        <span class="label">المجموع الفرعي</span>
        <span class="val">${$(sub())}</span>
      </div>
      <div class="summary-row">
        <span class="label">رسوم التوصيل</span>
        <span class="val">${$(fee())}</span>
      </div>
      <hr class="summary-divider">
      <div class="summary-total">
        <span>الإجمالي</span>
        <span class="val">${$(sub()+fee())}</span>
      </div>
    </div>
  </main>
  <div class="footer-bar">
    <button class="btn full" onclick="go('checkout')" aria-label="متابعة الشراء">متابعة الشراء</button>
  </div>
  ${bottomNav()}`;
}

/* ── Checkout ── */
function screenCheckout() {
  return `
  <header class="hdr" role="banner">
    <button class="hdr-btn" onclick="go('cart')" aria-label="رجوع">${iconBack()}</button>
    <h1 class="hdr-title">إتمام الطلب</h1>
    <div class="hdr-spacer"></div>
  </header>
  <main>
    <div class="card">
      <div class="card-title">
        <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="var(--pri)" stroke-width="2" stroke-linecap="round"><path d="M21 10c0 7-9 13-9 13s-9-6-9-13a9 9 0 0118 0z"/><circle cx="12" cy="10" r="3"/></svg>
        عنوان العيادة
      </div>
      <input
        class="form-input"
        value="عيادة د. سامر – عمّان، الدوار السابع، مبنى 12، الطابق 2"
        aria-label="عنوان العيادة">
    </div>
    <div class="card">
      <div class="card-title">
        <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="var(--pri)" stroke-width="2" stroke-linecap="round"><rect x="1" y="4" width="22" height="16" rx="2" ry="2"/><line x1="1" y1="10" x2="23" y2="10"/></svg>
        طريقة الدفع
      </div>
      <div class="pay-option" role="radio" aria-checked="true">
        <div class="pay-radio">
          <div class="pay-radio-dot"></div>
        </div>
        <div class="pay-info">
          <div class="pay-name">
            الدفع عند الاستلام
            <span class="selected-tag" style="margin-inline-start:6px">محدد</span>
          </div>
          <div class="pay-desc">ادفع نقداً عند وصول الطلب (Cash on Delivery)</div>
        </div>
        <div class="pay-icon-box">
          <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="white" stroke-width="2" stroke-linecap="round"><rect x="2" y="6" width="20" height="12" rx="2"/><circle cx="12" cy="12" r="2"/><path d="M6 12h.01M18 12h.01"/></svg>
        </div>
      </div>
    </div>
    <div class="summary-card">
      <div class="summary-row">
        <span class="label">المجموع الفرعي</span>
        <span class="val">${$(sub())}</span>
      </div>
      <div class="summary-row">
        <span class="label">رسوم التوصيل</span>
        <span class="val">${$(fee())}</span>
      </div>
      <hr class="summary-divider">
      <div class="summary-total">
        <span>الإجمالي</span>
        <span class="val">${$(sub()+fee())}</span>
      </div>
    </div>
  </main>
  <div class="footer-bar">
    <button class="btn full" onclick="go('done')" aria-label="تأكيد الطلب">تأكيد الطلب</button>
  </div>`;
}

/* ── Order Confirmation ── */
function screenDone() {
  const steps = [
    { label:"تم استلام الطلب بواسطة الموردين", done: true,  active: false },
    { label:"جاري تجهيز الشحنة والتغليف",       done: true,  active: false },
    { label:"السائق في الطريق إلى العيادة",       done: false, active: false }
  ];
  const tlHTML = steps.map((s, i) => {
    const isLast = i === steps.length - 1;
    const dotClass = s.done ? "done" : (s.active ? "active" : "pending");
    const lineClass = s.done ? "done" : "pending";
    const titleClass = (!s.done && !s.active) ? "pending" : "";
    return `
    <div class="tl-step">
      <div class="tl-col">
        <div class="tl-dot ${dotClass}" aria-label="${s.done?'مكتمل':'في الانتظار'}">
          ${s.done ? iconCheck(14) : (s.active ? iconCheck(14) : "")}
        </div>
        ${!isLast ? `<div class="tl-line ${lineClass}"></div>` : ""}
      </div>
      <div class="tl-body">
        <div class="tl-title ${titleClass}">${s.label}</div>
      </div>
    </div>`;
  }).join("");

  return `
  <header class="hdr" role="banner">
    <div class="hdr-spacer"></div>
    <h1 class="hdr-title">تأكيد الطلب والمتابعة</h1>
    <div class="hdr-spacer"></div>
  </header>
  <main>
    <div class="success-wrap">
      <div class="success-circle" aria-label="تم تأكيد الطلب بنجاح">
        <svg width="40" height="40" viewBox="0 0 24 24" fill="none" stroke="var(--good)" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round">
          <polyline points="20 6 9 17 4 12"/>
        </svg>
      </div>
      <h2 class="success-h">تم استلام طلبك بنجاح</h2>
      <p class="success-sub">سيتواصل معك الموردون قريباً</p>
    </div>
    <div class="card">
      <div class="card-title">حالة التوصيل</div>
      <div class="timeline" role="list" aria-label="مراحل الطلب">
        ${tlHTML}
      </div>
    </div>
  </main>
  <div class="footer-bar">
    <button
      class="btn full success-ghost"
      onclick="S.cart=[];S.q='';S.cat=-1;go('home')"
      aria-label="بدء طلب جديد">
      طلب جديد
    </button>
  </div>`;
}

/* ══════════════════════════════════════════════
   RENDER
══════════════════════════════════════════════ */
function render(keep) {
  const a = document.getElementById("app");
  const prevScrollTop = keep ? (document.querySelector("main") || {}).scrollTop : 0;

  let h = "";
  if      (S.screen === "home")     h = screenHome();
  else if (S.screen === "detail")   h = screenDetail();
  else if (S.screen === "cart")     h = screenCart();
  else if (S.screen === "checkout") h = screenCheckout();
  else                               h = screenDone();

  a.innerHTML = h;

  // Restore scroll
  const m = a.querySelector("main");
  if (m && prevScrollTop) m.scrollTop = prevScrollTop;

  // Wire up search
  const qi = document.getElementById("q");
  if (qi) {
    const update = () => {
      S.q = qi.value;
      document.getElementById("l").innerHTML = renderList();
    };
    qi.addEventListener("input",  update);
    qi.addEventListener("search", update);
    qi.addEventListener("keydown", e => { if (e.key==="Enter") { update(); qi.blur(); } });
    if (keep) qi.focus();
  }
}

render();
</script>
</body>
</html>
